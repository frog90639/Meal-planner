/* ============================================================
   PLAN GENERATION
   ============================================================ */
function generatePlan(){
  const startISO = wizard.startDate;
  const endISO = wizard.endDate;
  const days = datesBetween(startISO, endISO);
  if(wizard.mode==='replace'){ proceedGeneratePlan(true); return; }
  if(wizard.mode==='fill'){ wizard.contextCounts = true; wizard.scaleSlots = days.length*2; proceedGeneratePlan(false); return; }
  const hasContent = days.some(date=>{ const d=peekDay(date); return d.lunch.status!=='empty'||d.dinner.status!=='empty'; });
  if(hasContent){
    showOverlay(`
      <div style="display:flex;justify-content:flex-end;margin:-6px -4px 0 0;">
        <button class="del-x" onclick="closeOverlay()" aria-label="Cancel" style="font-size:20px;">✕</button>
      </div>
      <h2 style="margin-top:-8px;">Replace existing plan?</h2>
      <p class="desc">Some of these days already have a plan. Replace everything, or just fill in whatever's still blank?</p>
      <div class="btnrow">
        <button class="btn ghost" onclick="wizard.contextCounts=true;wizard.scaleSlots=datesBetween(wizard.startDate,wizard.endDate).length*2;proceedGeneratePlan(false)">No, just fill blanks</button>
        <button class="btn primary" onclick="proceedGeneratePlan(true)">Yes, replace all</button>
      </div>
    `);
    return;
  }
  proceedGeneratePlan(true);
}
function proceedGeneratePlan(overwriteAll){
  if(!wizard.noUndo) captureUndo(); // planning can wipe a week — always undoable
  const R = getRules(wizard.rules); // settings defaults, with this plan's overrides on top
  // a wizard question that's switched off contributes nothing, even if it was answered earlier
  if(!R.askFancy) wizard.fancyBaseIds = [];
  if(!R.askBusy){ wizard.busyLevel = 1; wizard.busyDate = null; }
  if(!R.askFreezer) wizard.freezerSelectedIds = [];
  if(!R.askNew){ wizard.newText = ''; wizard.newItemsQueue = []; }
  const startISO = wizard.startDate;
  const endISO = wizard.endDate;
  const days = datesBetween(startISO, endISO);

  let replacedFreezerNames = [];
  if(overwriteAll){
    const lostSlots = [];
    days.forEach(date=>{ const d = state.days[date]; if(d) lostSlots.push(d.lunch, d.dinner); });
    replacedFreezerNames = freezerNamesIn(lostSlots);
    returnToFreezer(replacedFreezerNames, R.freezerReturn);
    days.forEach(date=>{ state.days[date] = {lunch:emptySlot(), dinner:emptySlot()}; });
  } else {
    days.forEach(date=>{ if(!state.days[date]) state.days[date] = {lunch:emptySlot(), dinner:emptySlot()}; });
  }

  const slotOrder = [];
  const overrides = []; // filled in below whenever a slot can only be filled by breaking a rule
  const shortfalls = []; // filled in below whenever an "at least" base target couldn't be fully met
  days.forEach(date=>{
    ['lunch','dinner'].forEach(meal=>{
      const key = date+'_'+meal;
      const day = state.days[date];
      if(wizard.onlySlots && !wizard.onlySlots.includes(key)){
        // a single-meal suggestion: leave every other slot alone
      } else if(R.daysOut && wizard.skips[key]){
        day[meal] = {status:'out', recipeId:null, recipeName:null, baseLabel:null};
      } else if(!overwriteAll && day[meal].status!=='empty'){
        // already has content and we're only filling blanks — leave it alone
      } else {
        slotOrder.push({date,meal});
      }
    });
  });

  // ---- priority items: freezer + new-to-try go straight into the first slots ----
  const priorityPool = [];
  const freezerBankIdByRecipeId = {};
  const freezerItemsSelected = (wizard.freezerSelectedIds||[]).map(id=>state.freezerBank.find(f=>f.id===id)).filter(Boolean);
  if(freezerItemsSelected.length){
    const freezerType = getOrCreateMealType('Freezer');
    freezerItemsSelected.forEach(item=>{
      const r = {id:uid(), name:item.name, baseIds:[], typeIds:[freezerType.id], frequencyWeeks:1, multiply:false, lastUsedWeekStart:null, ephemeral:true};
      state.recipes.push(r);
      priorityPool.push(r);
      freezerBankIdByRecipeId[r.id] = item.id;
    });
  }
  const newItems = (wizard.newItemsQueue && wizard.newItemsQueue.length) ? wizard.newItemsQueue : parseList(wizard.newText).map(name=>({name, baseIds:[], typeIds:[]}));
  if(newItems.length){
    const newType = getOrCreateMealType('New');
    newItems.forEach(item=>{
      const typeIds = Array.from(new Set([...(item.typeIds||[]), newType.id]));
      const r = {id:uid(), name:item.name, baseIds:item.baseIds||[], typeIds, frequencyWeeks:1, multiply:false, lastUsedWeekStart:null, ephemeral:false};
      state.recipes.push(r);
      priorityPool.push(r);
    });
  }

  const usedIds = new Set(priorityPool.map(r=>r.id));
  const priorityCount = Math.min(priorityPool.length, slotOrder.length);
  // spread priority items across different days (one per day while days last) instead of
  // dropping them into the first consecutive slots, which put two on the same day
  const slotsLeft = slotOrder.slice();
  const priorityDates = new Set();
  for(let i=0;i<priorityCount;i++){
    const r = priorityPool[i];
    const fitsSlot = s=>!R.slotPrefs || recipeSlotOk(r, s.meal);
    let idx = R.spreadPriority ? slotsLeft.findIndex(s=>!priorityDates.has(s.date) && fitsSlot(s)) : -1;
    if(idx===-1) idx = slotsLeft.findIndex(fitsSlot);
    if(idx===-1) idx = 0;
    const slot = slotsLeft.splice(idx,1)[0];
    priorityDates.add(slot.date);
    const day = state.days[slot.date];
    day[slot.meal] = {status:'planned', recipeId:r.id, recipeName:r.name, baseLabel: mealDisplayLabel(r)||null};
    if(freezerBankIdByRecipeId[r.id]) day[slot.meal].fromFreezer = true; // remembers it came out of the freezer bank
    r.lastUsedWeekStart = slot.date;
    if(freezerBankIdByRecipeId[r.id]){
      state.freezerBank = state.freezerBank.filter(f=>f.id!==freezerBankIdByRecipeId[r.id]);
    }
  }
  const priorityPlaced = priorityPool.slice(0,priorityCount);
  priorityPlaced.forEach(r=>removeIfEphemeral(r));
  const remainingSlots = slotsLeft;

  if(remainingSlots.length){
    const fancy = wizard.fancyBaseIds || [];
    const fancyNoCap = R.fancyOverridesCap ? fancy : [];

    function isManualOnly(r){
      return R.manualOnly && (r.typeIds||[]).some(id=>{ const t=getMealType(id); return t && t.manualOnly; });
    }
    function seasonOkAt(r, refDate){
      if(!R.season) return true;
      const season = getSeason(refDate);
      return !(r.baseIds||[]).some(id=>{ const b=getMealBase(id); return b && (b.excludedSeasons||[]).includes(season); });
    }
    // hard "not more often than every N weeks" check — a recipe used inside its own
    // frequency window is genuinely ineligible for that slot, not just down-weighted
    function freqOkAt(r, refDate){
      if(!R.freqGap) return true;
      const freq = r.frequencyWeeks || 1;
      return !(r.lastUsedWeekStart && weeksBetween(r.lastUsedWeekStart, refDate) < freq);
    }
    // the exact same recipe already sitting on this day (lunch === dinner) — always
    // excluded, never part of the relax cascade below
    function sameRecipeAlreadyOnDay(r, date){
      if(!R.sameRecipeDay) return false;
      const day = state.days[date];
      if(!day) return false;
      return ['lunch','dinner'].some(meal=>day[meal].status==='planned' && day[meal].recipeId===r.id);
    }
    // avoid two DIFFERENT meals sharing a meal base or an obvious shared ingredient
    // (e.g. two stews, or two titles both mentioning chickpeas) landing on the same day
    function hasBaseConflictOnDay(r, date){
      if(!R.sameDayClash) return false;
      const day = state.days[date];
      if(!day) return false;
      return ['lunch','dinner'].some(meal=>{
        const slot = day[meal];
        if(slot.status!=='planned' || !slot.recipeId || slot.recipeId===r.id) return false;
        const other = getRecipe(slot.recipeId);
        if(!other) return false;
        const baseClash = (r.baseIds||[]).length && (other.baseIds||[]).some(id=>(r.baseIds||[]).includes(id));
        return baseClash || sharesNameWord(r, other);
      });
    }
    function shuffle(list){
      const arr = list.slice();
      for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
      return arr;
    }

    // one simple weighted pick per slot: nudges toward variety and toward tags marked
    // "use for busiest-day meals" (the easy/mindless tag) — never a hard rule, so a slot
    // is only ever left blank if literally no recipe exists in the library at all
    const usedThisRun = new Set();
    const baseUsedCount = {};
    const typeUsedCount = {};
    // items already placed up front (freezer / new-to-try) still count toward caps and variety
    priorityPlaced.forEach(r=>{
      usedThisRun.add(r.id);
      (r.baseIds||[]).forEach(id=>baseUsedCount[id]=(baseUsedCount[id]||0)+1);
      (r.typeIds||[]).forEach(id=>typeUsedCount[id]=(typeUsedCount[id]||0)+1);
    });
    // meals already on the calendar in the same week(s) count towards variety; when filling
    // gaps or suggesting a single meal they also count towards caps, minimums and leanings
    (()=>{
      const toFill = new Set(slotOrder.map(x=>x.date+'_'+x.meal));
      datesBetween(mondayOnOrBefore(startISO), addDays(mondayOnOrBefore(endISO),6)).forEach(d=>{
        const day = state.days[d]; if(!day) return;
        ['lunch','dinner'].forEach(m=>{
          if(toFill.has(d+'_'+m)) return;
          const sl = day[m]; if(!sl || sl.status!=='planned' || !sl.recipeId) return;
          const r = getRecipe(sl.recipeId); if(!r || r.ephemeral) return;
          usedThisRun.add(r.id);
          if(wizard.contextCounts){
            (r.baseIds||[]).forEach(id=>baseUsedCount[id]=(baseUsedCount[id]||0)+1);
            (r.typeIds||[]).forEach(id=>typeUsedCount[id]=(typeUsedCount[id]||0)+1);
          }
        });
      });
    })();

    // for "include regularly" bases, find how long it's actually been since each one
    // last appeared anywhere in the plan, so a long-absent base can get a boost
    const regularBaseLastGap = {}; // baseId -> weeks since last used (Infinity if never)
    state.mealBases.filter(b=>b.ruleType==='regular').forEach(b=>{
      let latest = null;
      Object.keys(state.days).forEach(d=>{
        const day = state.days[d];
        ['lunch','dinner'].forEach(m=>{
          const slot = day[m];
          if(slot.status==='planned' && slot.recipeId){
            const r = getRecipe(slot.recipeId);
            if(r && (r.baseIds||[]).includes(b.id) && (!latest || d>latest)) latest = d;
          }
        });
      });
      regularBaseLastGap[b.id] = latest ? Math.max(0, weeksBetween(latest, startISO)) : Infinity;
    });

    // every "X per week" rule is really "X per 14 meals" — scale it to however many
    // meals this session actually covers, so a 3-day plan and a 10-day plan both apply
    // the rule proportionally instead of assuming a fixed calendar week
    const scaleFactor = (wizard.scaleSlots || slotOrder.length) / 14;
    function scaledTarget(n){
      if(!n || n<=0) return 0;
      return Math.max(1, Math.round(n * scaleFactor));
    }

    // an "up to N" meal base is a firm cap, not a nudge: once N recipes from it are in
    // this plan, nothing else from that base goes in (relaxed only as a last resort)
    function capReached(r){
      if(!R.upToCap) return false;
      return (r.baseIds||[]).some(id=>{
        const b = getMealBase(id);
        if(!b || b.ruleType==='min' || b.ruleType==='regular') return false;
        if(fancyNoCap.includes(id)) return false; // asked for "more of this" in the wizard — overrides the cap
        const cap = scaledTarget(b.weeklyTarget);
        return cap>0 && (baseUsedCount[id]||0) >= cap;
      });
    }
    function capRoom(r){ // how many more copies of r fit before an "up to" cap is hit
      if(!R.upToCap) return Infinity;
      let room = Infinity;
      (r.baseIds||[]).forEach(id=>{
        const b = getMealBase(id);
        if(!b || b.ruleType==='min' || b.ruleType==='regular' || fancyNoCap.includes(id)) return;
        const cap = scaledTarget(b.weeklyTarget);
        if(cap>0) room = Math.min(room, cap-(baseUsedCount[id]||0));
      });
      return room;
    }
    // "very busy" (or busier) is a firm preference: stick to meals tagged for busy days or
    // from the bases picked in "what are you fancying", only dipping into anything else
    // when those genuinely run out
    const veryBusy = R.veryBusyStrict && (wizard.busyLevel||1) >= 2;
    function isFancyRecipe(r){ return (r.baseIds||[]).some(id=>fancy.includes(id)); }
    function slotOk(r, meal){ return !R.slotPrefs || recipeSlotOk(r, meal); }
    function isBusyPreferred(r){
      return (r.typeIds||[]).some(id=>{ const t=getMealType(id); return t && t.busyDay; })
        || (r.baseIds||[]).some(id=>fancy.includes(id));
    }

    function weightFor(r, refDate, isBusySlot){
      let w = 1;
      (r.typeIds||[]).forEach(id=>{
        const t = getMealType(id);
        if(!t) return;
        const effectiveMin = scaledTarget(t.weeklyMin);
        // in a very busy week only the top-choice busy types keep their weekly-minimum push
        if(R.typeMinimums && effectiveMin>0 && !(veryBusy && typeBusyTier(t)<2)){
          const usedCount = typeUsedCount[id]||0;
          if(usedCount < effectiveMin) w *= (1 + (effectiveMin-usedCount)*1.5); // nudge toward the floor
          else w *= Math.pow(0.7, usedCount-effectiveMin); // taper off once met
        }
      });
      (r.baseIds||[]).forEach(id=>{
        const b = getMealBase(id);
        if(!b) return;
        // a base picked in "what are you fancying" gets no tapering, caps or per-use decay —
        // the explicit ask for more of it wins over the usual limits for this plan
        if(fancyNoCap.includes(id)) return;
        const usedCount = baseUsedCount[id]||0;
        if(b.ruleType==='min' && !R.minBases) return;
        if(b.ruleType==='min' && !skipMinIds.includes(id)){
          // the hard reservation pass above already tries to guarantee this target outright;
          // this nudge just helps the general fill lean the same way for any slots it left
          // open. Skipped for this run, it's treated like a plain 'upto' base instead.
          const effectiveTarget = scaledTarget(b.weeklyTarget);
          if(effectiveTarget>0){
            if(usedCount < effectiveTarget) w *= (1 + (effectiveTarget-usedCount)*1.5);
            else w *= Math.pow(0.7, usedCount-effectiveTarget);
          }
        } else if(b.ruleType==='regular'){
          if(!R.regularBoost) return;
          const gapWeeks = regularBaseLastGap[id];
          const reminderAt = Math.max(1, b.weeklyTarget||2);
          if(gapWeeks===Infinity) w *= 4; // never used yet — give it a real chance
          else if(gapWeeks>=reminderAt) w *= (1 + (gapWeeks-reminderAt+1)*1.2);
          if(usedThisRun.has(r.id) || baseUsedCount[id]) w *= Math.pow(0.6, usedCount); // still avoid overdoing it once picked
        } else {
          // 'upto' (default): a soft cap, never forbidden if nothing else is available
          const effectiveCap = scaledTarget(b.weeklyTarget);
          if(R.upToCap && effectiveCap>0 && usedCount>=effectiveCap) w *= 0.15;
          else w *= Math.pow(0.6, usedCount);
        }
      });
      // busy-day types: "top choice" (e.g. Mindless) leans about 3x harder than plain "yes" (e.g. Easy)
      // busy-day types only get a lean when the week (or that day) is actually busy;
      // a normal week just follows your type minimums
      const tier = recipeBusyTier(r);
      const busyWeek = (wizard.busyLevel||1) > 1;
      if(tier && (busyWeek || isBusySlot)){
        const lean = (isBusySlot ? 10 : 3) * (wizard.busyLevel||1);
        w *= tier===2 ? lean : Math.max(1, lean/6);
      }
      // rotation: the longer a recipe has gone beyond its own "every N weeks" gap, the more
      // likely it is to come round, so the whole library cycles through over the weeks
      if(R.rotation){
        const gap = r.frequencyWeeks || 1;
        const since = r.lastUsedWeekStart && !usedThisRun.has(r.id) ? weeksBetween(r.lastUsedWeekStart, refDate) : null;
        const overdue = since===null ? (r.lastUsedWeekStart ? 0 : 6) : Math.max(0, since - gap);
        w *= 1 + Math.min(overdue, 10) * 0.6;
      }
      // soft nudge away from reuse always; the hard once-per-plan rule is the 'variety' setting.
      // A base you're fancying is allowed to come round again, so it's barely penalised
      if(usedThisRun.has(r.id)) w *= isFancyRecipe(r) ? 0.6 : 0.1;
      // frequency is now a hard filter before pools reach here (see freqOkAt); this
      // weight only matters in the rare relaxed-fallback case where it's re-included
      if(r.lastUsedWeekStart){
        const freq = r.frequencyWeeks || 1;
        if(weeksBetween(r.lastUsedWeekStart, refDate) < freq) w *= 0.12;
      }
      // picked bases get a real lead; on a very busy stretch the lead is stronger still
      if(fancy.length) w *= (r.baseIds||[]).some(id=>fancy.includes(id)) ? (veryBusy ? 4 : 2.5) : 0.6;
      return w;
    }
    function weightedPick(pool, refDate, isBusySlot, preferFn){
      const preferred = preferFn ? pool.filter(preferFn) : pool;
      const use = preferred.length ? preferred : pool;
      const weights = use.map(r=>weightFor(r, refDate, isBusySlot));
      const total = weights.reduce((a,b)=>a+b,0);
      let rnd = Math.random()*total;
      for(let i=0;i<use.length;i++){ rnd -= weights[i]; if(rnd<=0) return use[i]; }
      return use[use.length-1];
    }
    const generalPlaced = []; // slots filled by the planner (not priority items) — candidates the companion pass may adjust
    function place(slot, r){
      generalPlaced.push({date:slot.date, meal:slot.meal});
      const day = state.days[slot.date];
      day[slot.meal] = {status:'planned', recipeId:r.id, recipeName:r.name, baseLabel: mealDisplayLabel(r)||null};
      r.lastUsedWeekStart = slot.date;
      usedThisRun.add(r.id);
      (r.baseIds||[]).forEach(id=>baseUsedCount[id]=(baseUsedCount[id]||0)+1);
      (r.typeIds||[]).forEach(id=>typeUsedCount[id]=(typeUsedCount[id]||0)+1);
    }

    let openSlots = remainingSlots.slice();
    const excludeIds = wizard.excludeIds || [];
    const basePoolAll = state.recipes.filter(r=>!r.ephemeral && !isManualOnly(r) && !excludeIds.includes(r.id));

    // "at least" meal bases are a hard target, not a nudge — reserve slots for them up
    // front (before multiply/general fill get a say) so the target actually gets hit
    // whenever the library has enough eligible recipes, unless the user explicitly
    // skipped this base for this one-off plan in the wizard.
    const skipMinIds = wizard.skipMinBaseIds || [];
    state.mealBases.filter(b=>R.minBases && b.ruleType==='min' && !skipMinIds.includes(b.id)).forEach(b=>{
      // anything from this base already in the week (or placed up front) counts towards the target
      const fullTarget = scaledTarget(b.weeklyTarget);
      const target = Math.max(0, fullTarget - (baseUsedCount[b.id]||0));
      if(!target) return;
      const eligibleRecipes = basePoolAll.filter(r=>(r.baseIds||[]).includes(b.id));
      if(!eligibleRecipes.length) return;
      let reserved = 0;
      for(let i=0; i<target && openSlots.length; i++){
        let placedThis = false;
        for(const slot of openSlots){
          const candidates = eligibleRecipes.filter(r=>
            (!veryBusy || isBusyPreferred(r) || !eligibleRecipes.some(isBusyPreferred)) &&
            slotOk(r, slot.meal) && seasonOkAt(r, slot.date) && freqOkAt(r, slot.date) &&
            !hasBaseConflictOnDay(r, slot.date) && !sameRecipeAlreadyOnDay(r, slot.date) &&
            !usedThisRun.has(r.id) && !capReached(r)
          );
          if(candidates.length){
            const picked = weightedPick(candidates, slot.date, false, null);
            const idx = openSlots.indexOf(slot);
            openSlots.splice(idx,1);
            place(slot, picked);
            reserved++;
            placedThis = true;
            break;
          }
        }
        if(!placedThis) break; // no eligible slot/recipe combo left — stop trying for this base
      }
      if(reserved < target){
        shortfalls.push({baseId:b.id, baseName:b.name, target, reserved});
      }
    });

    // multiply-flagged recipes get a chance to feature 2-3x, spaced across different
    // days (never twice the same day, every copy within 2 days of its first appearance)
    // multiply is a garnish, not the whole plan: it may use at most ~a quarter of what's
    // left, so the weighted fill (and any picked "fancying" bases) still gets real say.
    // When bases are picked, only recipes from those bases get multiplied.
    let multiplyBudget = Math.max(2, Math.floor(openSlots.length/4));
    const multiplyPool = basePoolAll.filter(r=>r.multiply && (!veryBusy || isBusyPreferred(r)) &&
      (!fancy.length || (r.baseIds||[]).some(id=>fancy.includes(id))));
    // weighted shuffle, so the same leanings (busy-day tiers, fancying, type minimums) decide
    // which repeat-friendly recipes get their 2-3 slots first
    const weightedOrder = list=>list.map(r=>({r, k:Math.pow(Math.random(), 1/Math.max(1e-6, weightFor(r, startISO, false)))})).sort((a,b)=>b.k-a.k).map(x=>x.r);
    (R.repeatPair ? weightedOrder(multiplyPool) : []).forEach(r=>{
      if(multiplyBudget<=0 || !openSlots.length || usedThisRun.has(r.id)) return;
      if(capRoom(r) < 1) return;
      if(Math.random() < 0.35) return; // don't force every multiply recipe in every single run
      // a multiply recipe must still respect its own season and frequency window —
      // if it's not eligible to start anywhere in this run, skip it entirely
      const eligibleStartSlots = openSlots.filter(s=>slotOk(r,s.meal) && seasonOkAt(r,s.date) && freqOkAt(r,s.date) && maxRepeatsOk(r,s.date));
      if(!eligibleStartSlots.length) return;
      const copies = Math.min(Math.random()<0.5?2:3, capRoom(r), multiplyBudget);
      // never at the cost of the same-day shared-base rule — if there's no clean slot, skip it
      let startSlot = eligibleStartSlots.find(s=>s.date!==wizard.busyDate && !hasBaseConflictOnDay(r,s.date));
      if(!startSlot) startSlot = eligibleStartSlots.find(s=>!hasBaseConflictOnDay(r,s.date));
      if(!startSlot) return;
      const startIdx = openSlots.indexOf(startSlot);
      openSlots.splice(startIdx,1);
      const startDate = startSlot.date;
      const maxDate = addDays(startDate, R.repeatWindow);
      const placements = [startSlot];
      const usedDates = new Set([startDate]);
      for(let k=1;k<copies;k++){
        // once placed, later copies only need to still be in-season/in-window at their
        // own date and within the 2-day spread of the first appearance
        const idx = openSlots.findIndex(s=>!usedDates.has(s.date) && s.date<=maxDate && slotOk(r,s.meal) && seasonOkAt(r,s.date) && !hasBaseConflictOnDay(r,s.date) && maxRepeatsOk(r,s.date));
        if(idx===-1) break;
        const [s] = openSlots.splice(idx,1);
        placements.push(s);
        usedDates.add(s.date);
      }
      placements.forEach(slot=>{ place(slot, r); });
      multiplyBudget -= placements.length;
    });

    // fill everything else — one weighted pick per remaining slot. Season and frequency
    // are the rules with numbers behind them, so they're protected the longest. Variety
    // (don't reuse a recipe already placed elsewhere this run) and the same-day "shared
    // base/ingredient" check are both softer nice-to-haves, and are always fully explored
    // — together, in every combination — before season or frequency is ever relaxed at
    // all. Only once every reuse/conflict combination has been tried and failed does the
    // search move on to relaxing season or frequency too. Whatever ends up broken to fill
    // the slot is recorded so it can be explained afterwards.
    function poolForFlags(pool, slot, relaxSeason, relaxFreq, relaxConflict, relaxReuse, relaxCap){
      return pool.filter(r=>
        (relaxSeason || seasonOkAt(r, slot.date)) &&
        (relaxFreq || freqOkAt(r, slot.date)) &&
        (relaxConflict || !hasBaseConflictOnDay(r, slot.date)) &&
        ((relaxReuse || !R.variety || isFancyRecipe(r)) ? maxRepeatsOk(r, slot.date) : !usedThisRun.has(r.id)) &&
        (relaxCap || !capReached(r))
      );
    }
    // ---- helpers for the "repeat-friendly recipes always come in 2-3" rule ----
    function dayGap(a,b){ return Math.abs((Date.parse(a)-Date.parse(b))/86400000); }
    // a repeat-friendly recipe never goes beyond 3 appearances inside any rolling 7 days
    function maxRepeatsOk(r, date){
      // repeat-friendly recipes and anything from a base you're fancying: never more than 3 in any 7 days
      if(!((R.repeatPair && r.multiply) || isFancyRecipe(r))) return true;
      const dates = [date];
      Object.keys(state.days).forEach(d=>['lunch','dinner'].forEach(m=>{
        const sl = state.days[d][m];
        if(sl && sl.status==='planned' && sl.recipeId===r.id) dates.push(d);
      }));
      for(let off=-6; off<=0; off++){
        const start = addDays(date, off), end = addDays(start, 6);
        if(dates.filter(d=>d>=start && d<=end).length > 3) return false;
      }
      return true;
    }
    function hasCompanionNear(rid, date){
      return Object.keys(state.days).some(d=>dayGap(d,date)<=R.repeatWindow && d!==date &&
        ['lunch','dinner'].some(m=>{ const sl=state.days[d][m]; return sl && sl.status==='planned' && sl.recipeId===rid; }));
    }
    // later open slots (different days, within 6 days) a repeat-friendly recipe can also take
    function findCompanions(r, slot){
      const room = capRoom(r);
      const copies = Math.min(Math.random()<0.5?2:3, room);
      if(copies<2) return [];
      const picked = [], usedDates = new Set([slot.date]);
      openSlots.filter(o=>o.date!==slot.date && dayGap(o.date,slot.date)<=R.repeatWindow && slotOk(r,o.meal) && seasonOkAt(r,o.date) &&
        !hasBaseConflictOnDay(r,o.date) && !sameRecipeAlreadyOnDay(r,o.date) && maxRepeatsOk(r,o.date))
        .sort((x,y)=>dayGap(x.date,slot.date)-dayGap(y.date,slot.date))
        .forEach(o=>{ if(picked.length<copies-1 && !usedDates.has(o.date)){ picked.push(o); usedDates.add(o.date); } });
      return picked;
    }
    const fillSlot = (slot)=>{
      // the exact same recipe twice on the exact same day is excluded up front, relaxed
      // only if literally nothing else in the whole library is left to try
      // lunch-only / dinner-only is a hard rule: never relaxed
      const slotPool = basePoolAll.filter(r=>slotOk(r, slot.meal));
      const dayPool = slotPool.filter(r=>!sameRecipeAlreadyOnDay(r, slot.date));
      const searchPool = dayPool.length ? dayPool : slotPool;
      // on a very busy stretch, each tier first tries the busy-friendly meals, then
      // everything else, before moving on to relax anything further
      // very busy: only busy-friendly meals (busy-day types or picked bases) are ever
      // considered — slower meals are skipped entirely unless nothing busy-friendly exists
      const busyOnly = veryBusy ? searchPool.filter(isBusyPreferred) : [];
      const scopes = veryBusy ? (busyOnly.length ? [busyOnly] : [searchPool]) : [searchPool];
      let pool = [];
      search:
      for(const relaxCap of [false, true]){
        for(let outerCount=0; outerCount<=2; outerCount++){
          // for a bulk-cooking plan, repeating a meal is far better than two similar meals on
          // one day, so reuse is relaxed on its own first, and the same-day check only after
          for(const im of [0, 2, 1, 3]){
            for(const scope of scopes){
              const seen = new Set();
              const tierPool = [];
              for(let om=0; om<4; om++){
                if(((om&1?1:0)+(om&2?1:0))!==outerCount) continue;
                const relaxSeason = !!(om&1), relaxFreq = !!(om&2);
                {
                  const relaxConflict = !!(im&1), relaxReuse = !!(im&2);
                  poolForFlags(scope, slot, relaxSeason, relaxFreq, relaxConflict, relaxReuse, relaxCap).forEach(r=>{
                    if(!seen.has(r.id)){ seen.add(r.id); tierPool.push(r); }
                  });
                }
              }
              if(tierPool.length){ pool = tierPool; break search; }
            }
          }
        }
      }
      if(!pool.length) return;
      const isBusySlot = !!(wizard.busyDate && slot.date===wizard.busyDate);
      let picked = weightedPick(pool, slot.date, isBusySlot, null);
      let companions = [];
      if(R.repeatPair && picked && picked.multiply && !hasCompanionNear(picked.id, slot.date)){
        // a repeat-friendly recipe must come with at least one more copy inside 7 days;
        // if it can't, try another pick (the first pick stays as a last resort)
        const firstPick = picked, tried = new Set();
        companions = findCompanions(picked, slot);
        while(!companions.length){
          tried.add(picked.id);
          const rest = pool.filter(c=>!tried.has(c.id));
          if(!rest.length){ picked = firstPick; break; }
          picked = weightedPick(rest, slot.date, isBusySlot, null);
          if(!picked.multiply || hasCompanionNear(picked.id, slot.date)) break;
          companions = findCompanions(picked, slot);
        }
      }
      if(picked){
        // check what rules this pick actually breaks BEFORE placing — place() sets
        // lastUsedWeekStart to today, which would make freqOkAt look violated afterwards
        // even for a recipe that had never been used before
        const violated = [];
        if(!seasonOkAt(picked, slot.date)) violated.push('season');
        if(!freqOkAt(picked, slot.date)) violated.push('frequency');
        if(hasBaseConflictOnDay(picked, slot.date)) violated.push('sameday');
        if(capReached(picked)) violated.push('cap');
        if(veryBusy && !isBusyPreferred(picked)) violated.push('busy');
        const busyTypeIds = state.mealTypes.filter(t=>typeBusyTier(t)>0).map(t=>t.id);
        place(slot, picked);
        companions.forEach(cs=>{ const ci=openSlots.indexOf(cs); if(ci>-1){ openSlots.splice(ci,1); place(cs, picked); } });
        if(violated.length) overrides.push({date:slot.date, meal:slot.meal, recipeId:picked.id, recipeName:picked.name, baseIds:(picked.baseIds||[]).slice(), typeIds:(picked.typeIds||[]).slice(), violated, suggestTypeIds: violated.includes('busy') && violated.length===1 ? busyTypeIds : null});
      }
    };
    while(openSlots.length) fillSlot(openSlots.shift());

    // ---- "yes, can repeat 2-3x a week" recipes are never left standing alone ----
    // A repeat-friendly recipe must have a second appearance within any rolling 7 days.
    // Any copy that ended up solo (picked once by the fill, or a spread that ran out of
    // room) gets a companion by swapping in for another planner-placed slot within 6 days;
    // if there is genuinely no room, the solo copy is swapped for a different meal instead.
    function planSlotsOf(rid){
      const out = [];
      Object.keys(state.days).forEach(d=>['lunch','dinner'].forEach(m=>{
        const sl = state.days[d][m];
        if(sl && sl.status==='planned' && sl.recipeId===rid) out.push({date:d, meal:m});
      }));
      return out;
    }
    function hasCompanion(rid, date, meal){
      return planSlotsOf(rid).some(o=>!(o.date===date && o.meal===meal) && dayGap(o.date,date)<=R.repeatWindow);
    }
    function unplace(slot){
      const sl = state.days[slot.date][slot.meal];
      const old = getRecipe(sl.recipeId);
      if(old){
        (old.baseIds||[]).forEach(id=>{ if(baseUsedCount[id]) baseUsedCount[id]--; });
        (old.typeIds||[]).forEach(id=>{ if(typeUsedCount[id]) typeUsedCount[id]--; });
      }
      state.days[slot.date][slot.meal] = emptySlot();
      const oi = overrides.findIndex(o=>o.date===slot.date && o.meal===slot.meal);
      if(oi>-1) overrides.splice(oi,1);
      return old;
    }
    function isGeneral(slot){ return generalPlaced.some(g=>g.date===slot.date && g.meal===slot.meal); }
    const soloFixed = new Set();
    (R.repeatPair ? generalPlaced.slice() : []).forEach(g=>{
      const sl = state.days[g.date][g.meal];
      if(!sl || sl.status!=='planned') return;
      const r = getRecipe(sl.recipeId);
      if(!r || !r.multiply || soloFixed.has(r.id)) return;
      if(hasCompanion(r.id, g.date, g.meal)) return;
      soloFixed.add(r.id);
      // donor: another planner-placed slot within 6 days that can hand its place over
      const donors = shuffle(generalPlaced.filter(t=>{
        if(t.date===g.date && t.meal===g.meal) return false;
        if(dayGap(t.date,g.date)>R.repeatWindow || t.date===g.date || !slotOk(r, t.meal)) return false;
        const ts = state.days[t.date][t.meal];
        if(!ts || ts.status!=='planned' || ts.recipeId===r.id) return false;
        const dr = getRecipe(ts.recipeId);
        if(!dr) return false;
        // never rob a repeat-friendly recipe that would be left solo, or a firm-target base
        if(dr.multiply && planSlotsOf(dr.id).filter(o=>!(o.date===t.date&&o.meal===t.meal)).length<2 &&
           planSlotsOf(dr.id).length<3) return false;
        if((dr.baseIds||[]).some(id=>{ const b=getMealBase(id); return (b && b.ruleType==='min') || fancy.includes(id); })) return false;
        return true;
      }));
      let done = false;
      if(capRoom(r) >= 1){
        for(const t of donors){
          if(!seasonOkAt(r, t.date)) continue;
          const keep = state.days[t.date][t.meal];
          unplace(t);
          if(!sameRecipeAlreadyOnDay(r, t.date) && !hasBaseConflictOnDay(r, t.date)){
            place(t, r); done = true; break;
          }
          state.days[t.date][t.meal] = keep; // couldn't use it — put the original back
          const kr = getRecipe(keep.recipeId);
          if(kr){ (kr.baseIds||[]).forEach(id=>baseUsedCount[id]=(baseUsedCount[id]||0)+1); (kr.typeIds||[]).forEach(id=>typeUsedCount[id]=(typeUsedCount[id]||0)+1); }
        }
      }
      if(done) return;
      // no room for a companion: swap the solo copy for a meal that doesn't need one
      const slotG = {date:g.date, meal:g.meal};
      const repl = shuffle(basePoolAll.filter(c=>
        c.id!==r.id && !c.multiply && !usedThisRun.has(c.id) && slotOk(c, g.meal) && seasonOkAt(c, g.date) &&
        (!veryBusy || isBusyPreferred(c))
      ));
      const keep = state.days[g.date][g.meal];
      unplace(slotG);
      let pick = repl.find(c=>!hasBaseConflictOnDay(c, g.date) && !sameRecipeAlreadyOnDay(c, g.date) && !capReached(c));
      // or let an existing pair of a repeat-friendly recipe become a trio here
      if(!pick) pick = shuffle(basePoolAll.filter(c=>c.id!==r.id && c.multiply && usedThisRun.has(c.id) &&
        slotOk(c, g.meal) && seasonOkAt(c, g.date) && (!veryBusy || isBusyPreferred(c)) &&
        hasCompanionNear(c.id, g.date) && maxRepeatsOk(c, g.date) &&
        !hasBaseConflictOnDay(c, g.date) && !sameRecipeAlreadyOnDay(c, g.date)))[0];
      if(pick){ place(slotG, pick); }
      else {
        state.days[g.date][g.meal] = keep; // nothing better — keep it rather than leave a gap
        (r.baseIds||[]).forEach(id=>baseUsedCount[id]=(baseUsedCount[id]||0)+1);
        (r.typeIds||[]).forEach(id=>typeUsedCount[id]=(typeUsedCount[id]||0)+1);
      }
    });
  }

  const planSig = settingsSignature();
  days.forEach(d=>{ if(state.days[d]) state.days[d].planSig = planSig; });
  state.lastViewedWeekStart = mondayOnOrBefore(startISO);
  viewWeekStart = mondayOnOrBefore(startISO);
  // a "replace the week" re-plan wipes and refills days directly, bypassing assignSlot —
  // reconcile every recipe's "last used" date against the calendar as it now stands
  recomputeAllLastUsed();
  saveState();
  refreshLiveShare();
  closeOverlay();
  render();

  const filledCount = slotOrder.filter(x=>state.days[x.date] && state.days[x.date][x.meal].status==='planned').length;
  if(wizard.quiet) return filledCount;
  const msg = (filledCount < slotOrder.length ? `Planned ${filledCount} of ${slotOrder.length} meals` : `Planned ${filledCount} meal${filledCount===1?'':'s'}`)
    + (replacedFreezerNames.length ? ` — ${freezerReturnNote(replacedFreezerNames, R.freezerReturn)}` : '');
  const actions = [{label:'Undo', onClick:undoLastAction}];
  if(overrides.length || shortfalls.length || filledCount < slotOrder.length){
    lastPlanNotes = {overrides, shortfalls, unfilled: slotOrder.length - filledCount};
    actions.unshift({label:'See notes', onClick:()=>showOverridesPopup(lastPlanNotes.overrides, lastPlanNotes.shortfalls, lastPlanNotes.unfilled)});
  }
  toast(msg, {actions, duration: 9000});
  return filledCount;
}

// explain any rule the planner had to break to fill a slot, and offer a one-tap way
// to add more recipes to whichever category was short
function overrideReasonParts(o){
  const baseLabel = (o.baseIds||[]).map(id=>{ const b=getMealBase(id); return b?b.name:null; }).filter(Boolean).join('/');
  return o.violated.map(v=>{
    if(v==='season') return `${baseLabel||'its meal base'} is marked out of season right now`;
    if(v==='frequency') return `its repeat rule wants a longer gap since it was last used`;
    if(v==='sameday') return `something with a similar base or ingredient was already planned that day`;
    if(v==='cap') return `its meal base already hit its "up to" limit for this plan`;
    if(v==='busy') return `this was marked a very busy stretch and it isn't one of your busy-day or picked meals`;
    return v;
  });
}
let lastPlanNotes = null;
function showOverridesPopup(overrides, shortfalls, unfilled){
  overrides = overrides||[]; shortfalls = shortfalls||[];
  if(!overrides.length && !shortfalls.length && !unfilled) return;
  const overrideRows = overrides.map(o=>{
    const baseLabel = (o.baseIds||[]).map(id=>{ const b=getMealBase(id); return b?b.name:null; }).filter(Boolean).join('/');
    const reasonParts = overrideReasonParts(o);
    const preselect = JSON.stringify(o.suggestTypeIds ? {baseIds:[], typeIds:o.suggestTypeIds} : {baseIds:o.baseIds, typeIds:o.typeIds});
    return `<div class="override-row" style="margin-bottom:10px;">
      <p class="desc" style="margin:0 0 6px;"><strong>${escapeHtml(dayShort(o.date))} ${o.meal}:</strong> put in "${escapeHtml(o.recipeName)}" even though ${reasonParts.map(escapeHtml).join(' and ')} — there weren't enough other eligible recipes at that point.</p>
      <button type="button" class="btn ghost small" onclick='openRecipeEditorPreselect(${preselect})'>+ Add a recipe for ${o.suggestTypeIds ? 'busy days' : escapeHtml(baseLabel||'this')}</button>
    </div>`;
  }).join('');
  const shortfallRows = shortfalls.map(s=>{
    const preselect = JSON.stringify({baseIds:[s.baseId], typeIds:[]});
    return `<div class="override-row" style="margin-bottom:10px;">
      <p class="desc" style="margin:0 0 6px;"><strong>${escapeHtml(s.baseName)}:</strong> only fit ${s.reserved} of the "at least ${s.target}" target — there weren't enough eligible recipes in that base for this stretch.</p>
      <button type="button" class="btn ghost small" onclick='openRecipeEditorPreselect(${preselect})'>+ Add a recipe for ${escapeHtml(s.baseName)}</button>
    </div>`;
  }).join('');
  showOverlay(`
    <div style="display:flex;justify-content:flex-end;margin:-6px -4px 0 0;">
      <button class="del-x" onclick="closeOverlay()" aria-label="Close" style="font-size:20px;">✕</button>
    </div>
    <h2 style="margin-top:-8px;">Notes on this plan</h2>
    <p class="desc">${unfilled ? `${unfilled} meal${unfilled===1?'':'s'} couldn't be filled — you may not have enough recipes that fit your rules. ` : ''}${overrides.length||shortfalls.length ? "Here's what didn't go entirely to plan:" : ''}</p>
    ${overrideRows}${shortfallRows}
    <div class="btnrow"><button class="btn primary" onclick="closeOverlay()">Got it</button></div>
  `);
}
function openRecipeEditorPreselect(preselect){
  closeOverlay();
  openRecipeEditor(null, preselect);
}

function showDialog(html){
  hideToast();
  document.getElementById('dialogRoot').innerHTML = `
    <div class="overlay dialog-layer" onclick="if(event.target===this)closeDialog()">
      <div class="modal dialog">${html}</div>

function appPrompt(o, onOk){
  dialogHandlers.ok = onOk;
  showDialog(`<h2>${escapeHtml(o.title)}</h2>${o.msg?`<p class="desc">${escapeHtml(o.msg)}</p>`:''}

    <div class="btnrow"><button class="btn ghost" onclick="closeDialog()">Cancel</button>
    <button class="btn primary" id="dialogOk" style="flex:1;" onclick="const v=(document.getElementById('dialogInput')||{}).value||'';const f=dialogHandlers.ok;closeDialog();f&&f(v)">${escapeHtml(o.ok||'Add')}</button></div>`);

}

/* ============================================================
   SHARE — live link (Firestore) with a snapshot-link fallback
   ============================================================ */
function b64EncodeUnicode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUnicode(str){ return decodeURIComponent(escape(atob(str))); }
function simplifySlot(s){
  if(s.status==='out') return {status:'out'};
  if(s.status==='planned') return {status:'planned', name:s.recipeName||'', base:s.baseLabel||''};
  return {status:'empty'};
}
function buildShareUrl(){
  return `${location.origin}${location.pathname}#live=${encodeURIComponent(shareMeta.shareId)}`;
}
let lastSyncStatus = { state:'none', time:null, error:null }; // 'none' | 'ok' | 'error'
// what the other person sees: same labels as your own view (base + ticked types)
function shareableDays(){
  const out = {};
  Object.keys(state.days).forEach(d=>{
    const day = state.days[d], o = {};
    ['lunch','dinner'].forEach(m=>{
      const s = day[m] || emptySlot(); const r = s.recipeId ? getRecipe(s.recipeId) : null;
      o[m] = {status:s.status, recipeId:s.recipeId||null, recipeName:s.recipeName||(r?r.name:null), baseLabel: r ? (mealDisplayLabel(r)||null) : (s.baseLabel||null)};
    });
    out[d] = o;
  });
  return out;
}
function refreshLiveShare(){
  if(!shareMeta.active || !shareMeta.shareId || !firebaseDb) return;
  firebaseDb.collection('sharedWeeks').doc(shareMeta.shareId)
    .set({ days: shareableDays(), viewWeekStart: shareMeta.weekStart, updatedAt: Date.now() })
    .then(()=>{ lastSyncStatus = { state:'ok', time:Date.now(), error:null }; })
    .catch((err)=>{ lastSyncStatus = { state:'error', time:Date.now(), error:(err&&err.message)||String(err) }; });
}
function copyOrShow(url, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>toast(msg)).catch(()=>showShareFallback(url, msg));
  } else {
    showShareFallback(url, msg);
  }
}
function shareCurrentWeek(){
  if(!firebaseDb){ appAlert('Sharing unavailable', "Live sharing isn't available right now — check your connection and try again."); return; }
  if(shareMeta.active){
    showShareInfo();
    return;
  }
  shareMeta.active = true;
  shareMeta.weekStart = viewWeekStart;
  ensureShareId();
  saveShareMeta();
  refreshLiveShare();
  copyOrShow(buildShareUrl(), 'Live link copied — it updates automatically as you edit, and they can swipe through weeks too');
}
function syncStatusLine(){
  if(lastSyncStatus.state==='none') return '<p class="desc" style="color:var(--ink-soft);">Not synced yet — edit a meal to trigger the first sync.</p>';
  const when = new Date(lastSyncStatus.time).toLocaleTimeString();
  if(lastSyncStatus.state==='ok') return `<p class="desc" style="color:var(--sage-dark);">✓ Synced successfully at ${when}</p>`;
  return `<p class="desc" style="color:var(--brick-dark);">✕ Sync FAILED at ${when} — ${escapeHtml(lastSyncStatus.error||'unknown error')}<br>This usually means the Firestore security rules don't match. Check them in the Firebase console.</p>`;
}
function refreshShareInfoAfterSync(){
  refreshLiveShare();
  setTimeout(()=>{ if(shareMeta.active) showShareInfo(); }, 700);

/* ---- live view: full days map synced from Firestore, swipeable like Home ---- */
let liveViewDays = {};
let liveViewWeekStart = null;
function peekLiveDay(dateISO){ return liveViewDays[dateISO] || {lunch:emptySlot(), dinner:emptySlot()}; }
function listenLiveShare(shareId){
  renderSharedMessage('Loading…');
  if(!firebaseDb){ renderSharedMessage("Couldn't connect to load this shared plan."); return; }
  firebaseDb.collection('sharedWeeks').doc(shareId).onSnapshot(doc=>{
    if(!doc.exists){ renderSharedMessage('This link is no longer being shared.'); return; }
    const data = doc.data();
    liveViewDays = data.days || {};
    if(!liveViewWeekStart){
      liveViewWeekStart = data.viewWeekStart || mondayOnOrBefore(todayISO());
    }
    renderLiveShareHome();
  }, ()=>{
    renderSharedMessage("Couldn't load this shared plan.");
  });
}
function shiftLiveWeek(n){
  liveViewWeekStart = addDays(liveViewWeekStart, n);
  renderLiveShareHome();
}
function renderLiveShareHome(){
  const days = weekDates(liveViewWeekStart);
  const firstLabel = fromISO(days[0]).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  const lastLabel = fromISO(days[6]).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  const daysHtml = days.map(date=>{
    const d = peekLiveDay(date);
    return `
    <div class="daycard">
      <div class="dayhead">
        <span class="dname">${dayName(date)}</span>
        <span class="ddate">${dayShort(date)}</span>
        ${date===todayISO()?'<span class="today-flag">today</span>':''}
      </div>
      ${renderReadOnlyMealRow(d.lunch,'lunch')}
      ${renderReadOnlyMealRow(d.dinner,'dinner')}
    </div>`;
  }).join('');
  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="brand">
        <span class="kicker">shared meal plan · live</span>
        <h1>Meal Plan</h1>
      </div>
    </div>
    <div class="weeknav">
      <button class="navbtn" onclick="shiftLiveWeek(-7)">‹</button>
      <div class="range">${firstLabel} – ${lastLabel}<small>swipe to change week</small></div>
      <button class="navbtn" onclick="shiftLiveWeek(7)">›</button>
    </div>
    <div class="week-wrap" id="liveWeekWrap">${daysHtml}</div>
    <p class="hint">This updates automatically as they edit — nothing here can be edited by you.</p>
  `;
  attachLiveSwipeHandlers();
}
function attachLiveSwipeHandlers(){
  const wrap = document.getElementById('liveWeekWrap');
  if(!wrap) return;
  let sx=0, sy=0, dragging=false;
  wrap.addEventListener('touchstart', e=>{
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; dragging=true;
  }, {passive:true});
  wrap.addEventListener('touchend', e=>{
    if(!dragging) return; dragging=false;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
      shiftLiveWeek(dx < 0 ? 7 : -7);
    }
  }, {passive:true});
}

function bumpBaseTarget(id, delta){

      .sort((a,b)=>a.name.localeCompare(b.name));
    const noGroupRecipes = all.filter(r=>!(r[idsField]||[]).length);
    if(noGroupRecipes.length) groups.push({id:'__none__', name: groupBy==='base' ? 'No meal base' : 'No meal type', recipes: noGroupRecipes});
    groupsHtml = groups.map(g=>{
      const key = 'recipeGroup_'+groupBy+'_'+g.id;
      return `
      <details class="cat-card" style="box-shadow:none;padding:6px 2px;margin-bottom:2px;border-bottom:1px solid var(--paper-line);border-radius:0;"${openSections.has(key)?' open':''} ontoggle="trackSectionToggle('${key}',this.open)">
        <summary><h4 class="section-title" style="font-size:15px;margin:0;">${escapeHtml(g.name)}</h4><span class="sec-count">${g.recipes.length}</span></summary>
        <div class="cat-body">${g.recipes.map(recipeRowHtml).join('')}</div>
      </details>`;
    }).join('') || '<p class="hint">No recipes yet — add your first one.</p>';
  }
  return `
    <div class="recipes-toolbar">
      <select onchange="setRecipeGroupBy(this.value)" aria-label="Group by">
        <option value="base" ${groupBy==='base'?'selected':''}>By base · ${all.length}</option>
        <option value="type" ${groupBy==='type'?'selected':''}>By type · ${all.length}</option>
        <option value="none" ${groupBy==='none'?'selected':''}>A–Z · ${all.length}</option>
      </select>
      <span class="spacer"></span>
      <button class="btn secondary small" onclick="openBulkImport()">Paste a list</button>
      <button class="btn primary small" onclick="openRecipeEditor(null)">+ Add</button>
    </div>
    <div class="cat-card">${groupsHtml}</div>`;
}

/* ---- bulk import: paste names, categorize each one, then save them all ---- */
let bulkImport = { queue:[], index:0 };
function openBulkImport(){
  showOverlay(`
    <h2>Bulk import recipes</h2>
    <p class="desc">Paste recipe names — one per line or separated by commas. You'll quickly tag each one next.</p>
    <div class="field">
      <textarea id="bulkImportText" rows="6" placeholder="e.g. Chicken traybake, Fish pie, Veggie chilli"></textarea>
    </div>
    <div class="btnrow">
      <button class="btn ghost" onclick="closeOverlay()">Cancel</button>
      <button class="btn primary" onclick="startBulkImport()">Next</button>
    </div>
  `);
}
function startBulkImport(){
  const names = parseList(document.getElementById('bulkImportText').value);
  if(!names.length){ closeOverlay(); return; }
  bulkImport = { queue: names.map(name=>({name, baseIds:[], typeIds:[], frequencyWeeks:1, multiply:false})), index:0 };
  showBulkImportItem();
}
function showBulkImportItem(){
  const item = bulkImport.queue[bulkImport.index];
  const total = bulkImport.queue.length;
  const baseChips = state.mealBases.map(b=>`<button type="button" class="chip ${item.baseIds.includes(b.id)?'active':''}" data-id="${b.id}" onclick="toggleBulkImportBase('${b.id}')">${escapeHtml(b.name)}</button>`).join('')
    + `<button type="button" class="chip" style="border-style:dashed;" onclick="bulkImportNewBase()">+ new</button>`;
  const typeChips = state.mealTypes.map(t=>`<button type="button" class="chip type-chip ${item.typeIds.includes(t.id)?'active':''}" data-id="${t.id}" onclick="toggleBulkImportType('${t.id}')">${escapeHtml(t.name)}</button>`).join('')
    + `<button type="button" class="chip type-chip" style="border-style:dashed;" onclick="bulkImportNewType()">+ new</button>`;
  showOverlay(`
    <p class="desc" style="margin-bottom:4px;">Recipe ${bulkImport.index+1} of ${total}</p>
    <h2>${escapeHtml(item.name)}</h2>
    <div class="field">
      <label>Meal base — pick any that apply</label>
      <div class="chip-group" id="bulkImportBaseChips">${baseChips}</div>
    </div>
    <div class="field">
      <label>Meal type — pick any that apply</label>
      <div class="chip-group" id="bulkImportTypeChips">${typeChips}</div>
    </div>
    <div class="field">
      <label>How often</label>
      <select id="bulkImportFreq" onchange="bulkImport.queue[bulkImport.index].frequencyWeeks=parseInt(this.value,10)||1">
        ${[1,2,3,4,5,6,8].map(n=>`<option value="${n}" ${item.frequencyWeeks===n?'selected':''}>${n===1?'Any week':'Every '+n+' weeks'}</option>`).join('')}
      </select>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);margin-bottom:6px;">
      <input type="checkbox" style="width:18px;height:18px;accent-color:var(--brick);" ${item.multiply?'checked':''} onchange="bulkImport.queue[bulkImport.index].multiply=this.checked">
      2–3× a week (batch cook: it comes back 2–3 times within a few days)
    </label>
    <div class="btnrow">
      <button class="btn ghost" onclick="skipBulkImportItem()">Skip this one</button>
      <button class="btn primary" onclick="nextBulkImportItem()">${bulkImport.index+1<total?'Save & next':'Save & finish'}</button>
    </div>
  `);
}
function toggleBulkImportBase(id){
  const item = bulkImport.queue[bulkImport.index];
  const i = item.baseIds.indexOf(id);
  if(i===-1) item.baseIds.push(id); else item.baseIds.splice(i,1);
  const el = document.querySelector(`#bulkImportBaseChips [data-id="${id}"]`); if(el) el.classList.toggle('active');
}
function toggleBulkImportType(id){
  const item = bulkImport.queue[bulkImport.index];
  const i = item.typeIds.indexOf(id);
  if(i===-1) item.typeIds.push(id); else item.typeIds.splice(i,1);
  const el = document.querySelector(`#bulkImportTypeChips [data-id="${id}"]`); if(el) el.classList.toggle('active');
}
function bulkImportNewBase(){
  appPrompt({title:'New meal base', placeholder:'e.g. Couscous'}, name=>{
    if(!name || !name.trim()) return;
    const b = getOrCreateMealBase(name.trim());
    bulkImport.queue[bulkImport.index].baseIds.push(b.id);
    showBulkImportItem();
  });
}
function bulkImportNewType(){
  appPrompt({title:'New meal type', placeholder:'e.g. Batch cook'}, name=>{
    if(!name || !name.trim()) return;
    const t = getOrCreateMealType(name.trim());
    bulkImport.queue[bulkImport.index].typeIds.push(t.id);
    showBulkImportItem();
  });
}
function skipBulkImportItem(){
  bulkImport.queue.splice(bulkImport.index,1);
  finishOrShowNextBulkImportItem();
}
function nextBulkImportItem(){
  bulkImport.index++;
  finishOrShowNextBulkImportItem();
}
function finishOrShowNextBulkImportItem(){
  if(bulkImport.index >= bulkImport.queue.length){
    const added = bulkImport.queue.length;
    bulkImport.queue.forEach(item=>{
      state.recipes.push({id:uid(), name:item.name, baseIds:item.baseIds, typeIds:item.typeIds, frequencyWeeks:item.frequencyWeeks||1, multiply:!!item.multiply, lastUsedWeekStart:null, ephemeral:false});
    });
    bulkImport = { queue:[], index:0 };
    saveState();
    closeOverlay();
    render();
    toast(added ? `Added ${added} recipe${added===1?'':'s'}` : 'Nothing to add');
    return;
  }
  showBulkImportItem();
}

let editingRecipeId = null;
function openRecipeEditor(id, preselect){
  editingRecipeId = id;
  const r = id ? getRecipe(id) : {name:'', baseIds:(preselect&&preselect.baseIds)||[], typeIds:(preselect&&preselect.typeIds)||[], frequencyWeeks:1, multiply:false};
  window.__editorDraft = { baseIds:[...(r.baseIds||[])], typeIds:[...(r.typeIds||[])] };

  const baseChips = state.mealBases.map(b=>`<button type="button" class="chip ${(r.baseIds||[]).includes(b.id)?'active':''}" data-id="${b.id}" onclick="toggleEditorBase('${b.id}')">${escapeHtml(b.name)}</button>`).join('')
    + `<button type="button" class="chip" style="border-style:dashed;" onclick="editorNewBase()">+ new</button>`;
  const typeChips = state.mealTypes.map(t=>`<button type="button" class="chip type-chip ${(r.typeIds||[]).includes(t.id)?'active':''}" data-id="${t.id}" onclick="toggleEditorType('${t.id}')">${escapeHtml(t.name)}</button>`).join('')
    + `<button type="button" class="chip type-chip" style="border-style:dashed;" onclick="editorNewType()">+ new</button>`;

  showOverlay(`
    <h2>${id?'Edit recipe':'Add a recipe'}</h2>
    <div class="field">
      <label>Name</label>
      <input type="text" id="editRecipeName" value="${escapeHtml(r.name)}" placeholder="e.g. Chicken traybake">
    </div>
    <div class="field">
      <label>Meal base — pick any that apply</label>
      <div class="chip-group" id="editBaseChips">${baseChips}</div>
    </div>
    <div class="field">
      <label>Meal type — pick any that apply</label>
      <div class="chip-group" id="editTypeChips">${typeChips}</div>
    </div>
    <div class="field">
      <label>How often</label>
      <select id="editRecipeFreq">
        ${[1,2,3,4,5,6,8].map(n=>`<option value="${n}" ${(r.frequencyWeeks||1)===n?'selected':''}>${n===1?'Any week':'Every '+n+' weeks'}</option>`).join('')}
      </select>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);margin-bottom:6px;">
      <input type="checkbox" style="width:18px;height:18px;accent-color:var(--brick);" id="editRecipeMultiply" ${r.multiply?'checked':''}>
      2–3× a week (batch cook: it comes back 2–3 times within a few days)
    </label>
    <div class="btnrow">
      <button class="btn ghost" onclick="closeOverlay()">Cancel</button>
      <button class="btn primary" style="flex:1;" onclick="saveRecipeFromEditor()">Save</button>
    </div>
    ${id?`<button class="link-danger" onclick="deleteRecipeFromEditor('${id}')">Delete this recipe</button>`:''}
  `);
}
function toggleEditorBase(id){
  const d = window.__editorDraft; const i = d.baseIds.indexOf(id);
  if(i===-1) d.baseIds.push(id); else d.baseIds.splice(i,1);
  const el = document.querySelector(`#editBaseChips [data-id="${id}"]`); if(el) el.classList.toggle('active');
}
function toggleEditorType(id){
  const d = window.__editorDraft; const i = d.typeIds.indexOf(id);
  if(i===-1) d.typeIds.push(id); else d.typeIds.splice(i,1);
  const el = document.querySelector(`#editTypeChips [data-id="${id}"]`); if(el) el.classList.toggle('active');
}
function editorNewBase(){
  appPrompt({title:'New meal base', placeholder:'e.g. Couscous'}, name=>{
    if(!name || !name.trim()) return;
    const b = getOrCreateMealBase(name.trim());
    window.__editorDraft.baseIds.push(b.id);
    reopenRecipeEditorPreservingName();
  });
}
function editorNewType(){
  appPrompt({title:'New meal type', placeholder:'e.g. Batch cook'}, name=>{
    if(!name || !name.trim()) return;
    const t = getOrCreateMealType(name.trim());
    window.__editorDraft.typeIds.push(t.id);
    reopenRecipeEditorPreservingName();
  });
}
function reopenRecipeEditorPreservingName(){
  const typedName = (document.getElementById('editRecipeName')||{}).value || '';
  const keepDraft = window.__editorDraft;
  openRecipeEditor(editingRecipeId);
  window.__editorDraft = keepDraft;
  keepDraft.baseIds.forEach(id=>{ const el=document.querySelector(`#editBaseChips [data-id="${id}"]`); if(el) el.classList.add('active'); });
  keepDraft.typeIds.forEach(id=>{ const el=document.querySelector(`#editTypeChips [data-id="${id}"]`); if(el) el.classList.add('active'); });
  const nameEl = document.getElementById('editRecipeName'); if(nameEl) nameEl.value = typedName;
}
function saveRecipeFromEditor(){
  const name = document.getElementById('editRecipeName').value.trim();
  if(!name) return;
  confirmIfDuplicateName(name, editingRecipeId, ()=>{
    const freq = parseInt(document.getElementById('editRecipeFreq').value,10)||1;
    const multiply = document.getElementById('editRecipeMultiply').checked;
    const d = window.__editorDraft;
    if(editingRecipeId){
      const r = getRecipe(editingRecipeId);
      r.name=name; r.baseIds=d.baseIds; r.typeIds=d.typeIds; r.frequencyWeeks=freq; r.multiply=multiply;
    } else {
      state.recipes.push({id:uid(), name, baseIds:d.baseIds, typeIds:d.typeIds, frequencyWeeks:freq, multiply, lastUsedWeekStart:null, ephemeral:false});
    }
    saveState();
    closeOverlay();
    render();
  });
}
function deleteRecipeFromEditor(id){
  appConfirm({title:'Delete this recipe?', msg:'You can undo straight after.', ok:'Delete', danger:true}, ()=>{
    captureUndo();
    state.recipes = state.recipes.filter(r=>r.id!==id);
    saveState();
    closeOverlay();
    render();
    toastWithUndo('Recipe deleted');
  });
}

/* ============================================================
   BACKUP
   ============================================================ */
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'meal-plan-backup.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data.mealBases || !data.mealTypes || !data.recipes || !data.days) throw new Error('bad file');
      state = data;
      if(!state.freezerBank) state.freezerBank = [];
      runDataMigrations();
      recomputeAllLastUsed(); // fix up any drift already present in the imported file
      saveState();
      toast('Backup restored');
      render();
    }catch(e){ appAlert("Couldn't restore", 'That file could not be read as a Meal Plan backup.'); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

/* ---------- init ---------- */
function registerOfflineSupport(){
  try{
    if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
  }catch(e){}
}
function initApp(){
  registerOfflineSupport();
  const hash = window.location.hash || '';
  if(hash.startsWith('#live=')){
    const shareId = decodeURIComponent(hash.slice(6));
    listenLiveShare(shareId);
    return;
  }
  if(hash.startsWith('#share=')){
    try{
      const encoded = decodeURIComponent(hash.slice(7));
      const payload = JSON.parse(b64DecodeUnicode(encoded));
      renderSharedView(payload, false);
      return;
    }catch(e){ /* fall through to the normal app if the link is malformed */ }
  }
  render();
}
initApp();
</script>
