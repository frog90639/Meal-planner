<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Meal Plan</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF3E1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1712" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Meal Plan">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#FFF3E1;
    --bg-elevated:#FFE7C2;
    --board-line:#F1DBAE;
    --paper:#FFFFFF;
    --paper-2:#FFF3DE;
    --paper-line:#F0DEBE;
    --ink:#33291C;
    --ink-soft:#6E5F48;
    --surface:#FFFFFF;
    --field:#FFFFFF;
    --glow:#FFEACB;
    --notice:#FFF6DC;
    --notice-line:#F0D58A;
    --switch-off:#C9C3B6;
    --mustard:#FFB238;
    --mustard-ink:#5C3A00;
    --brick:#FF6B4A;
    --brick-dark:#E1502F;
    --sage:#2FB6A3;
    --sage-dark:#1D8577;
    --radius:12px;
    --shadow:0 8px 20px rgba(150,90,30,.16);
    --font-display:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--glow) 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    padding-bottom:40px;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .app{max-width:560px;margin:0 auto;padding:18px 16px 8px;}

  /* Top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .brand{display:flex;flex-direction:column;line-height:1;}
  .brand .kicker{font-size:11px;letter-spacing:.04em;color:var(--sage-dark);margin-bottom:4px;}
  .brand h1{font-family:var(--font-display);font-weight:700;font-size:26px;margin:0;color:var(--ink);}
  .iconbtn{
    background:var(--bg-elevated);border:1px solid var(--board-line);color:var(--ink);
    width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:18px;flex:none;
  }
  .iconbtn:active{transform:scale(.94);}

  /* Stamp-style plan button */
  .stamp-btn{
    display:block;flex:1;text-align:center;
    background:var(--brick);color:#FBF4E6;
    border:2px solid #E7C79A;
    border-radius:10px;
    padding:14px 10px;
    font-family:var(--font-display);
    font-size:19px;font-weight:700;letter-spacing:.02em;
    box-shadow:var(--shadow);
    transform:rotate(-0.6deg);
    margin:0;
    position:relative;
  }
  .stamp-btn:active{transform:rotate(-0.6deg) scale(.98);}
  .stamp-btn .sub{display:block;font-family:var(--font-body);font-weight:400;font-size:11.5px;opacity:.85;margin-top:2px;letter-spacing:.02em;}

  /* Week nav */
  .weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 2px;}
  .weeknav .range{font-family:var(--font-display);font-size:17px;color:var(--ink);text-align:center;}
  .weeknav .range small{display:block;font-family:var(--font-body);font-size:11px;color:var(--sage-dark);margin-top:2px;letter-spacing:.03em;}
  .navbtn{background:none;border:none;color:var(--ink);font-size:22px;padding:4px 10px;line-height:1;opacity:.7;}
  .navbtn:active{opacity:1;}

  /* Week card stack */
  .week-wrap{overflow:hidden;position:relative;touch-action:pan-y;}
  .daycard{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;position:relative;padding-left:14px;overflow:hidden;}
  .daycard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--brick);}
  .daycard .dayhead{display:flex;align-items:baseline;gap:8px;padding:10px 12px 4px;}
  .daycard .dayhead .dname{font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:15.5px;}
  .daycard .dayhead .ddate{font-size:12px;color:var(--ink-soft);}
  .daycard .dayhead .today-flag{margin-left:auto;font-size:10px;letter-spacing:.04em;color:var(--brick-dark);font-weight:700;background:rgba(181,72,45,.12);padding:2px 6px;border-radius:6px;}
  .meal-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px dashed var(--paper-line);}
  .meal-row .meal-label{width:52px;flex:none;font-size:11px;letter-spacing:.03em;color:var(--ink-soft);text-transform:lowercase;}
  .meal-row .slot{flex:1;min-height:36px;display:flex;flex-direction:column;justify-content:center;border-radius:8px;padding:6px 10px;}
  .slot.empty{border:1.5px dashed var(--paper-line);color:var(--ink-soft);font-size:13.5px;}
  .slot.planned{background:var(--paper-2);}
  .slot.planned .rname{color:var(--ink);font-weight:600;font-size:14px;}
  .slot.planned .rcat{color:var(--sage-dark);font-size:11px;margin-top:1px;}
  .slot.out{background:rgba(47,182,163,.13);color:var(--sage-dark);font-size:13px;font-style:italic;}
  .slot:active{filter:brightness(.97);}
  .empty-week-hint{text-align:center;color:var(--ink-soft);font-size:13px;padding:18px 10px 6px;line-height:1.5;}

  /* Modal / overlay */
  .overlay{position:fixed;inset:0;background:rgba(15,20,15,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fadein .15s ease-out;}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @media(min-width:620px){.overlay{align-items:center;}}
  .modal{background:var(--paper);color:var(--ink);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px 18px 22px;max-height:88vh;overflow-y:auto;}
  @media(min-width:620px){.modal{border-radius:16px;}}
  .modal h2{font-family:var(--font-display);margin:0 0 4px;font-size:21px;color:var(--ink);}
  .modal .desc{color:var(--ink-soft);font-size:13.5px;margin:0 0 16px;line-height:1.4;}
  .steps-dots{display:flex;gap:6px;margin-bottom:14px;}
  .steps-dots span{height:5px;flex:1;background:var(--paper-line);border-radius:3px;}
  .steps-dots span.active{background:var(--brick);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.01em;}
  .field input[type=date],.field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid var(--paper-line);
    background:var(--surface);font-size:15px;color:var(--ink);font-family:var(--font-body);
  }
  .field textarea{resize:vertical;line-height:1.4;}
  .checklist{border:1px solid var(--paper-line);border-radius:10px;overflow:hidden;}
  .checklist .crow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--paper-line);font-size:14px;background:var(--surface);}
  .checklist .crow:last-child{border-bottom:none;}
  .checklist .crow .cname{flex:1;color:var(--ink);}
  .checklist .crow .cname small{display:block;color:var(--ink-soft);font-size:11.5px;}
  .checklist input[type=checkbox]{width:19px;height:19px;accent-color:var(--brick);}
  .btnrow{display:flex;gap:10px;margin-top:18px;}
  .btn{flex:1;padding:13px 10px;border-radius:9px;border:none;font-size:15px;font-weight:600;text-align:center;}
  .btn.primary{background:var(--brick);color:#FBF4E6;}
  .btn.primary:disabled{opacity:.45;}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--paper-line);}
  .btn.small{padding:8px 12px;font-size:13px;flex:none;}
  .btn.danger{background:transparent;color:var(--brick-dark);border:1.5px solid rgba(181,72,45,.4);}

  /* chips (meal base / meal type multi-select) */
  .chip-group{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:7px 13px;border-radius:16px;border:1.5px solid var(--paper-line);background:var(--surface);font-size:12.5px;color:var(--ink-soft);}
  .chip.active{background:var(--brick);border-color:var(--brick);color:#fff;}
  .chip.type-chip.active{background:var(--sage-dark);border-color:var(--sage-dark);color:#fff;}
  .chip.season-chip{text-transform:capitalize;font-size:11px;padding:5px 10px;}
  .chip.season-chip.active{background:var(--brick-dark);border-color:var(--brick-dark);color:#fff;}
  .season-row{flex:1 1 100%;display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .season-label{font-size:11px;color:var(--ink-soft);flex:none;}

  /* recipe picker (slot editor) */
  .picker-cat{margin-bottom:10px;}
  .picker-cat h4{margin:0 0 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sage-dark);}
  details.picker-cat{border:1px solid var(--paper-line);border-radius:10px;background:var(--surface);overflow:hidden;}
  details.picker-cat summary{list-style:none;cursor:pointer;padding:11px 12px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sage-dark);display:flex;justify-content:space-between;align-items:center;}
  details.picker-cat summary::-webkit-details-marker{display:none;}
  details.picker-cat summary::after{content:'▸';font-size:11px;color:var(--ink-soft);transition:transform .15s;margin-left:auto;padding-left:8px;}
  details.picker-cat[open] summary::after{transform:rotate(90deg);}
  details.picker-cat summary .bname{flex:1;}
  details.picker-cat summary .count{font-size:11px;color:var(--ink-soft);text-transform:none;letter-spacing:0;margin-left:8px;}
  details.picker-cat .opts{padding:0 12px 12px;}
  details.picker-cat .opts .picker-opt:last-child{margin-bottom:0;}
  .picker-opt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--paper-line);border-radius:8px;background:var(--surface);margin-bottom:6px;font-size:14px;}
  .picker-opt .meta{color:var(--ink-soft);font-size:11.5px;}
  .picker-opt:active{background:var(--paper-2);}

  /* settings */
  .settings-wrap{padding-top:4px;}
  .cat-card{background:var(--paper);border-radius:12px;padding:14px 14px 12px;margin-bottom:14px;box-shadow:var(--shadow);color:var(--ink);}
  details.cat-card summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;}
  details.cat-card summary::-webkit-details-marker{display:none;}
  details.cat-card summary .section-title{margin:0;flex:1;}
  details.cat-card summary .sec-count{font-size:11.5px;color:var(--ink-soft);font-family:var(--font-body);font-weight:400;}
  details.cat-card > summary::after{content:'▸';font-size:13px;color:var(--ink-soft);transition:transform .15s;flex:none;}
  details.cat-card[open] > summary::after{transform:rotate(90deg);}
  details.cat-card .cat-body{margin-top:10px;}
  .section-title{font-family:var(--font-display);font-size:16px;margin:0 0 4px;color:var(--ink);}
  .section-desc{font-size:12px;color:var(--ink-soft);margin:0 0 10px;line-height:1.4;}
  .rule-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-top:1px dashed var(--paper-line);}
  .rule-row:first-child{border-top:none;}
  .rule-row input[type=text]{flex:1 1 100%;font-family:var(--font-display);font-weight:700;font-size:15px;border:none;background:transparent;color:var(--ink);padding:2px 0;}
  .target-stepper{display:flex;align-items:center;gap:6px;flex:none;}
  .target-stepper button{width:26px;height:26px;border-radius:6px;border:1px solid var(--paper-line);background:var(--surface);color:var(--ink);font-size:15px;line-height:1;}
  .target-stepper .tval{width:52px;text-align:center;font-size:12px;color:var(--ink-soft);}
  .rule-row select{flex:none;border:1px solid var(--paper-line);border-radius:6px;font-size:11px;padding:5px;background:var(--surface);color:var(--ink);}
  .busy-toggle{flex:1 1 100%;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .busy-toggle input{width:15px;height:15px;accent-color:var(--brick);}
  .del-x{background:none;border:none;color:var(--ink-soft);font-size:16px;padding:0 2px;flex:none;}
  .add-cat-form{display:flex;gap:8px;margin-top:10px;}
  .add-cat-form input{flex:1;padding:11px 12px;border-radius:9px;border:1.5px dashed var(--paper-line);background:var(--surface);color:var(--ink);font-size:14px;}
  .add-cat-form input::placeholder{color:var(--ink-soft);}
  .add-cat-form button{background:var(--mustard);color:var(--mustard-ink);border:none;border-radius:9px;padding:0 18px;font-weight:700;}
  .recipe-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px dashed var(--paper-line);}
  .recipe-row:first-child{border-top:none;}
  .recipe-row .rinfo .rn{color:var(--ink);font-size:14px;}
  .recipe-row .rinfo .rmeta{color:var(--ink-soft);font-size:11.5px;margin-top:2px;}
  .recipe-row .chev{color:var(--ink-soft);font-size:17px;flex:none;}
  .backup-row{display:flex;gap:10px;margin-top:22px;}
  .backup-row .btn{background:var(--bg-elevated);color:var(--ink);border:1px solid var(--board-line);}
  .hint{color:var(--ink-soft);font-size:11.5px;text-align:center;margin-top:10px;line-height:1.5;}
  #fileimport{display:none;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:20px;font-size:13.5px;box-shadow:var(--shadow);z-index:99;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:10px;max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .toast.with-action{pointer-events:auto;}
  .toast-undo{background:none;border:none;color:var(--brick-dark);font-weight:700;font-size:13.5px;padding:2px 0;cursor:pointer;flex-shrink:0;}
  .rule-group{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 2px;}
  .wrule{padding:8px 0;border-top:1px dashed var(--paper-line);}
  .wrule-top{display:flex;align-items:center;gap:8px;}
  .wrule-name{flex:1;font-size:13.5px;}
  .tipbtn{background:none;border:none;color:var(--ink-soft);font-size:15px;padding:2px 4px;cursor:pointer;}
  .wrule-tip{display:none;font-size:11.5px;color:var(--ink-soft);line-height:1.45;padding:4px 0 0;}
  .wrule-tip.show{display:block;}
  .wrule select{border:1px solid var(--paper-line);border-radius:6px;font-size:12px;padding:5px;background:var(--surface);color:var(--ink);}
  .switch{position:relative;display:inline-block;width:40px;height:22px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:var(--switch-off);border-radius:22px;transition:.2s;cursor:pointer;}
  .slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#FFFDF8;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--brick);}
  .switch input:checked + .slider:before{transform:translateX(18px);}
  #app{padding-bottom:86px;}
  .tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--paper);border-top:1px solid var(--paper-line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 -4px 16px rgba(0,0,0,.05);}
  .tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-soft);padding:4px 0;cursor:pointer;font-family:inherit;}
  .tab-ic{line-height:1;opacity:.6;display:flex;}
  .tab.active{color:var(--brick-dark);font-weight:700;}
  .tab.active .tab-ic{opacity:1;}
  .toast{bottom:84px !important;padding:8px 14px;font-size:13px;border-radius:14px;max-width:min(92vw,420px);box-shadow:0 4px 18px rgba(0,0,0,.14);}
  .toast .toast-msg{flex:1;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .toast-undo{font-size:13px !important;white-space:nowrap;}
  .notice-card{background:var(--surface);border-radius:14px;padding:14px 16px;margin:0 0 14px;box-shadow:var(--shadow);border-left:4px solid var(--mustard, #e0b04a);}
  .notice-card h3{margin:0 0 4px;font-size:15px;}
  .notice-card p{margin:0 0 10px;font-size:13px;color:var(--ink-soft);line-height:1.45;}
  .current-meal{background:var(--paper);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
  .current-meal .cm-name{font-weight:700;font-size:16px;}
  .current-meal .cm-label{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .action-grid .btn{width:100%;}
  .weekmenu-btn{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;padding:0 6px;}
  .dialog-layer{z-index:80;align-items:center;}
  .modal.dialog{max-width:360px;border-radius:18px;margin:0 16px;}
  .freezer-chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;background:var(--paper);border:1.5px solid var(--paper-line);border-radius:20px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;}
  .cloud-ok{color:var(--sage-dark);vertical-align:middle;display:inline-flex;margin-left:4px;}
  .backup-banner{display:flex;align-items:center;gap:8px;background:var(--notice);border:1px solid var(--notice-line);border-radius:12px;padding:8px 10px;margin:0 0 12px;font-size:12.5px;color:var(--ink);}
  .backup-banner span{flex:1;line-height:1.35;}
  .past-fold{display:block;width:100%;text-align:left;background:none;border:1.5px dashed var(--paper-line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
  .past-fold span{font-weight:400;}
  .daycard.past{opacity:.55;}
  .move-grid{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr);gap:6px 8px;align-items:center;margin-bottom:12px;}
  .move-grid .mday{font-size:13px;font-weight:700;}
  .move-cell{min-width:0;overflow:hidden;border:1.5px solid var(--paper-line);background:var(--surface);border-radius:10px;padding:7px 8px;text-align:left;font-size:12px;cursor:pointer;font-family:inherit;color:var(--ink);min-height:40px;}
  .move-cell small{display:block;color:var(--ink-soft);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .move-cell.current{border-color:var(--brick);background:var(--paper);cursor:default;}
  .link-danger{background:none;border:none;color:var(--brick-dark);text-decoration:underline;font-size:13px;cursor:pointer;padding:12px 0 0;font-family:inherit;display:block;margin:0 auto;}
  .wiz-q{font-size:15px;margin:14px 0 8px;font-family:inherit;}
  .linkbtn{background:none;border:none;color:var(--brick-dark);text-decoration:underline;padding:0;font-size:inherit;cursor:pointer;font-family:inherit;}
  .recipe-search{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--paper-line);font-size:15px;margin:0 0 14px;background:var(--surface);box-sizing:border-box;}
  .cfg-row{border-top:1px dashed var(--paper-line);padding:4px 0;}
  .cfg-row:first-of-type{border-top:none;}
  .cfg-row > summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 0;cursor:pointer;}
  .cfg-row > summary::-webkit-details-marker{display:none;}
  .cfg-row .cfg-name{font-weight:700;font-size:15px;}
  .cfg-row .cfg-sum{flex:1;font-size:12px;color:var(--ink-soft);text-align:right;}
  .cfg-row .cfg-chev{color:var(--ink-soft);font-size:12px;}
  .cfg-row > summary::after{content:'▸';font-size:12px;color:var(--ink-soft);transition:transform .15s;}
  .cfg-row[open] > summary::after{transform:rotate(90deg);}
  .cfg-body{padding:2px 0 12px;}
  .cfg-body .rule-row{border-top:none;padding-top:0;}

  /* ---- dark mode: follows the phone ---- */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17130F; --bg-elevated:#251F18; --board-line:#3A3026;
      --paper:#211B15; --paper-2:#2B241C; --paper-line:#3D3328;
      --ink:#F4EADB; --ink-soft:#BBA98E;
      --surface:#2A231B; --field:#2A231B; --glow:#241C14;
      --notice:#2E2616; --notice-line:#5A4A22; --switch-off:#4A4036;
      --brick:#FF6B4A; --brick-dark:#FF8A6D; --sage:#38C4B0; --sage-dark:#4FCDB9;
      --mustard:#E9A236; --mustard-ink:#2A1A00;
      --shadow:0 6px 18px rgba(0,0,0,.45);
    }
    .overlay{background:rgba(0,0,0,.7);}
    .slot.out{background:rgba(79,205,185,.12);}
    .daycard .dayhead .today-flag{background:rgba(255,107,74,.18);}
    input, select, textarea{color-scheme:dark;}
  }

  /* ---- icons ---- */
  .ic{width:20px;height:20px;display:inline-block;vertical-align:middle;flex:none;}
  .ic-sm{width:16px;height:16px;}
  .tab .ic{width:24px;height:24px;}
  .section-title .ic{margin:-3px 6px 0 0;color:var(--brick-dark);}

  /* ---- #6 calmer cards: stripe only on today, normal capitalisation ---- */
  .daycard::before{display:none;}
  .daycard.today::before{display:block;}
  .daycard{padding-left:4px;}
  .daycard.today{padding-left:14px;}
  details.picker-cat summary{text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--ink);}
  .picker-cat h4{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);}

  /* ---- #13 finger-sized tap targets ---- */
  .del-x{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;}
  .chip{min-height:36px;}
  .chip.season-chip{min-height:32px;}
  .target-stepper button{width:34px;height:34px;}
  .tipbtn{min-width:36px;min-height:36px;}
  .busy-toggle input{width:20px;height:20px;}
  .busy-toggle{font-size:12.5px;min-height:34px;}
  .navbtn{min-width:44px;min-height:44px;}

  /* ---- #5 one button system ---- */
  .add-cat-form button{background:var(--brick);color:#FFF8EE;}
  .btn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--paper-line);}
  .notice-card{border-left-color:var(--brick);}
  .recipes-toolbar{display:flex;gap:6px;align-items:center;margin:0 0 12px;flex-wrap:nowrap;}
  .recipes-toolbar .btn.small{padding:8px 10px;white-space:nowrap;}
  .recipes-toolbar .sec-count{white-space:nowrap;font-size:12px;}
  .recipes-toolbar select{padding:9px 10px;border-radius:9px;border:1.5px solid var(--paper-line);background:var(--field);color:var(--ink);font-size:13.5px;}
  .recipes-toolbar .spacer{flex:1;}
  .builtin-tag{font-size:10.5px;color:var(--ink-soft);border:1px solid var(--paper-line);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:400;font-family:var(--font-body);}
  .plan-ahead{border-left-color:var(--sage-dark);}
</style>

<body>
<div class="app" id="app"></div>
<div id="overlayRoot"></div>
<div id="dialogRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   STORAGE + MIGRATION
   ============================================================ */
const STORE_KEY = 'mealPlan.v3';
const V2_KEY = 'mealPlan.v2';
const V1_KEY = 'mealPlan.v1';

// cloud-sync state — declared up top so saveState() (defined below, but callable
// from the moment the app loads) can safely reference them regardless of load order
let firebaseDb = null;
let firebaseAuth = null;
let currentUser = null;
let applyingRemoteState = false;
let cloudSyncTimer = null;

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }

function seedDefaultState(){
  const mealBases = ['Pasta','Rice','Potato','Noodles','Bread','Salad'].map(name=>({id:uid(), name, weeklyTarget:1, ruleType:'upto', excludedSeasons:[]}));
  const mealTypes = [
    {id:uid(), name:'Mindless', weeklyMin:0, slotPref:null, busyDay:true, manualOnly:false},
    {id:uid(), name:'Easy', weeklyMin:0, slotPref:null, busyDay:false, manualOnly:false},
    {id:uid(), name:'Good for lunch', weeklyMin:0, slotPref:'lunch', busyDay:false, manualOnly:false},
    {id:uid(), name:'Good for dinner', weeklyMin:0, slotPref:'dinner', busyDay:false, manualOnly:false}
  ];
  return { mealBases, mealTypes, recipes:[], days:{}, lastViewedWeekStart:null, freezerBank:[] };
}
function migrateFromV1(old){
  const mealBases = (old.categories||[]).map(c=>({id:c.id, name:c.name, weeklyTarget:c.weeklyTarget||0, ruleType:'upto', excludedSeasons:[]}));
  const mealTypes = [
    {id:uid(), name:'Mindless', weeklyMin:0, slotPref:null, busyDay:true, manualOnly:false},
    {id:uid(), name:'Easy', weeklyMin:0, slotPref:null, busyDay:false, manualOnly:false},
    {id:uid(), name:'Good for lunch', weeklyMin:0, slotPref:'lunch', busyDay:false, manualOnly:false},
    {id:uid(), name:'Good for dinner', weeklyMin:0, slotPref:'dinner', busyDay:false, manualOnly:false}
  ];
  const recipes = (old.recipes||[]).map(r=>({
    id:r.id, name:r.name,
    baseIds: r.categoryId ? [r.categoryId] : [],
    typeIds: [],
    frequencyWeeks: r.frequencyWeeks||1,
    multiply: !!r.multiply,
    lastUsedWeekStart: r.lastUsedWeekStart||null,
    ephemeral:false
  }));
  const weeks = {};
  Object.keys(old.weeks||{}).forEach(k=>{
    const wk = old.weeks[k];
    weeks[k] = {
      startDate: wk.startDate,
      days: wk.days.map(d=>({
        date:d.date,
        lunch: migrateSlotV1(d.lunch),
        dinner: migrateSlotV1(d.dinner)
      }))
    };
  });
  return { mealBases, mealTypes, recipes, weeks, lastViewedWeekStart: old.lastViewedWeekStart||null };
}
function migrateSlotV1(s){
  if(!s) return {status:'empty', recipeId:null, recipeName:null, baseLabel:null};
  return {status:s.status, recipeId:s.recipeId||null, recipeName:s.recipeName||null, baseLabel:s.categoryName||null};
}
function flattenWeeksToDays(obj){
  const days = {};
  Object.values(obj.weeks||{}).forEach(week=>{
    (week.days||[]).forEach(d=>{ days[d.date] = {lunch:d.lunch, dinner:d.dinner}; });
  });
  return { mealBases: obj.mealBases, mealTypes: obj.mealTypes, recipes: obj.recipes, days, lastViewedWeekStart: obj.lastViewedWeekStart||null };
}
function loadState(){
  try{
    const rawV3 = localStorage.getItem(STORE_KEY);
    if(rawV3) return JSON.parse(rawV3);
    const rawV2 = localStorage.getItem(V2_KEY);
    if(rawV2) return flattenWeeksToDays(JSON.parse(rawV2));
    const rawV1 = localStorage.getItem(V1_KEY);
    if(rawV1) return flattenWeeksToDays(migrateFromV1(JSON.parse(rawV1)));
  }catch(e){}
  return seedDefaultState();
}
function saveState(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
  // if signed in, mirror this save up to the cloud shortly after — debounced so a
  // flurry of edits doesn't fire a write per keystroke. Skipped while we're in the
  // middle of applying a state that just came down FROM the cloud, so we don't
  // immediately write it straight back and spin.
  if(currentUser && firebaseDb && !applyingRemoteState){
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer = setTimeout(()=>{ pushStateToCloud(currentUser.uid); }, 800);
  }
}
// "last used" must always reflect what's actually still on the calendar — a recipe
// that gets cleared, swapped out, moved, or wiped by a "replace the week" re-plan should
// stop being treated as recently used. Rather than trying to patch every single place
// that removes or replaces a slot (easy to miss one), this recomputes it directly from
// state.days: the true source of truth. Call after any change to state.days.
function recomputeAllLastUsed(){
  const latestByRecipe = {};
  Object.keys(state.days).forEach(d=>{
    const day = state.days[d];
    ['lunch','dinner'].forEach(m=>{
      const slot = day[m];
      if(slot.status==='planned' && slot.recipeId){
        if(!latestByRecipe[slot.recipeId] || d>latestByRecipe[slot.recipeId]) latestByRecipe[slot.recipeId]=d;
      }
    });
  });
  state.recipes.forEach(r=>{ r.lastUsedWeekStart = latestByRecipe[r.id] || null; });
}
let state = loadState();
recomputeAllLastUsed(); // self-heal any drift already baked into existing saved data
function ensureBusyDayDefault(){
  if(!state.mealTypes.some(t=>t.busyDay)){
    const m = state.mealTypes.find(t=>t.name.trim().toLowerCase()==='mindless');
    if(m) m.busyDay = true;
  }
}
ensureBusyDayDefault();
// one-off tidy-ups agreed in the October review, plus the busy-tier field every type now has
function runDataMigrations(){
  state.migrated = state.migrated || {};
  (state.mealTypes||[]).forEach(t=>{ if(t.busyTier==null) t.busyTier = t.busyDay ? 2 : 0; });
  if(!state.migrated.review1){
    const lc = s=>String(s||'').trim().toLowerCase();
    // the "Freezer meal" base had no recipes and duplicated the freezer bank
    const fz = state.mealBases.find(b=>lc(b.name)==='freezer meal');
    if(fz && !state.recipes.some(r=>(r.baseIds||[]).includes(fz.id))) state.mealBases = state.mealBases.filter(b=>b!==fz);
    // "Not often" was really a manual-only type
    const no = state.mealTypes.find(t=>lc(t.name)==='not often' && t.manualOnly);
    if(no) no.name = 'Manual only';
    // Easy counts for busy days, Mindless stays top choice
    const easy = state.mealTypes.find(t=>lc(t.name)==='easy');
    if(easy && !easy.busyTier) easy.busyTier = 1;
    // the Freezer type is only for freezer-bank meals, which are always planned first anyway
    const frz = state.mealTypes.find(t=>lc(t.name)==='freezer');
    if(frz && frz.busyTier===2) frz.busyTier = 1;
    // "New" no longer has a weekly minimum — it wears off once you've had the meal
    const nw = state.mealTypes.find(t=>lc(t.name)==='new');
    if(nw) nw.weeklyMin = 0;
    // "include regularly" with a 0-week gap was secretly treated as 2 weeks
    state.mealBases.forEach(b=>{ if(b.ruleType==='regular' && !(b.weeklyTarget>0)) b.weeklyTarget = 2; });
    state.migrated.review1 = true;
  }
  (state.mealTypes||[]).forEach(t=>{ t.busyDay = t.busyTier>0; });
}
runDataMigrations();

/* ============================================================
   WIZARD RULES (Settings > Wizard settings; can be overridden per plan in the wizard)
   ============================================================ */
const WIZARD_RULES = [
  {group:'Wizard questions', key:'daysOut', label:'Ask which meals you\'re out', def:true,
   tip:"If on, the wizard asks which lunches/dinners you'll be out, and those slots are not filled. If off, that step is skipped and every slot is planned."},
  {group:'Wizard questions', key:'askFancy', label:'Ask what you\'re fancying', def:true,
   tip:"If on, the wizard asks which meal bases you want more of this time. If off, that step is skipped and your usual base rules apply."},
  {group:'Wizard questions', key:'askBusy', label:'Ask how busy the week is', def:true,
   tip:"If on, the wizard asks your overall pace and worst day, and leans on busy-day meals to match. If off, that step is skipped and every plan is a normal week."},
  {group:'Wizard questions', key:'askFreezer', label:'Ask what\'s in the freezer', def:true,
   tip:"If on, the wizard lets you pick freezer-bank meals to work in. If off, that step is skipped and no freezer meals are planned automatically."},
  {group:'Wizard questions', key:'askNew', label:'Ask about new recipes', def:true,
   tip:"If on, the wizard asks if you're cooking anything new. If off, that step is skipped."},
  {group:'How your answers are used', key:'fancyOverridesCap', label:'"Fancying" picks ignore "up to" limits', def:true,
   tip:"If on, a base you pick under 'what are you fancying' can go past its 'up to' limit. If off, it's still favoured but stops at its limit."},
  {group:'How your answers are used', key:'veryBusyStrict', label:'Very busy = busy-friendly meals only', def:true,
   tip:"If on, a 'very busy' week only uses busy-day meals (e.g. Mindless) and your fancying picks, never slower meals, unless nothing else is left for a slot. If off, very busy just favours them more strongly."},
  {group:'How your answers are used', key:'spreadPriority', label:'Spread freezer & new meals across days', def:true,
   tip:"Freezer and new-to-try meals are always placed first. If on, they go one per day where possible. If off, they take the first free slots (so can land on the same day)."},
  {group:'2–3× a week recipes', key:'repeatPair', label:'2–3× a week recipes: never just once', def:true,
   tip:"If on, a recipe marked '2–3× a week' always appears at least twice and never more than three times in any rolling 7 days. If off, it's planned once like any other recipe."},
  {group:'2–3× a week recipes', key:'repeatWindow', label:'Repeats land within', def:3, options:[1,2,3,4],
   tip:"How close together the copies must be: every copy lands within this many days of the first one. Only used when the rule above is on."},
  {group:'Meal bases', key:'minBases', label:'"At least" targets', def:true,
   tip:"If on, bases set to 'at least N' get slots reserved first so the target is hit, and the wizard lets you skip one for a single plan. If off, those targets are ignored."},
  {group:'Meal bases', key:'upToCap', label:'"Up to" limits', def:true,
   tip:"If on, a base set to 'up to N' stops being used once N are in the plan (unless nothing else is left). If off, those limits are ignored."},
  {group:'Meal bases', key:'regularBoost', label:'"Include regularly" boost', def:true,
   tip:"If on, a base set to 'include regularly' is pushed harder the longer it's been since it last appeared. If off, no push."},
  {group:'Recipes', key:'rotation', label:'Rotate through all your recipes', def:true,
   tip:"If on, recipes you haven't had for a while (beyond their 'every N weeks' gap) are picked more often, so your whole library cycles through over the weeks instead of the same favourites. If off, picks don't consider how long it's been."},
  {group:'Recipes', key:'variety', label:'Non-repeat recipes once per plan', def:true,
   tip:"If on, a recipe NOT marked '2–3× a week' appears at most once per plan (unless your library runs out). If off, it can occasionally come up twice."},
  {group:'Recipes', key:'freqGap', label:'"Every N weeks" gaps', def:true,
   tip:"If on, a recipe isn't used again until its 'not more often than every N weeks' gap has passed (copies of a repeat-friendly recipe in the same week don't count). If off, the gaps are ignored."},
  {group:'Recipes', key:'season', label:'Seasons', def:true,
   tip:"If on, bases marked out of season aren't used (unless nothing else fits). If off, seasons are ignored."},
  {group:'Recipes', key:'typeMinimums', label:'Meal type minimums', def:true,
   tip:"If on, meal types with a weekly minimum (e.g. Mindless 6) are pushed until it's met. If off, those minimums are ignored."},
  {group:'Recipes', key:'manualOnly', label:'Keep manual-only meals out', def:true,
   tip:"If on, meals with a type marked 'manual only' are never picked by the wizard. Turn off (e.g. just for one plan) to let them be picked too — your type settings stay as they are."},
  {group:'Same day', key:'slotPrefs', label:'Lunch-only / dinner-only types', def:true,
   tip:"If on, a recipe with a 'lunch only' type (e.g. Good for lunch) is only ever planned for lunch, and 'dinner only' only for dinner. A recipe with both can go in either. If off, they can go anywhere."},
  {group:'Same day', key:'sameRecipeDay', label:'No same recipe for lunch and dinner', def:true,
   tip:"If on, the same recipe is never planned for both lunch and dinner on one day. If off, it can be (e.g. leftovers)."},
  {group:'Same day', key:'sameDayClash', label:'No similar meals on one day', def:true,
   tip:"If on, two different meals sharing a base or an obvious ingredient word (e.g. both 'chickpea') won't land on the same day. If off, they can."},
  {group:'Clearing', key:'freezerReturn', label:'Freezer meals go back when cleared', def:true,
   tip:"If on, freezer meals in a week you clear or re-plan go back into the freezer bank (with an undo). If off, they're just removed."}
];
function defaultWizardRules(){ const o={}; WIZARD_RULES.forEach(r=>o[r.key]=r.def); return o; }
function getRules(extra){ return Object.assign(defaultWizardRules(), state.wizardRules||{}, extra||{}); }
function renderRuleRows(scope){
  const cur = scope==='wiz' ? getRules(wizard.rules) : getRules();
  const setter = scope==='wiz' ? 'setWizRule' : 'setWizardRule';
  let lastGroup = null, html = '', advancedOpen = false;
  WIZARD_RULES.forEach((r,i)=>{
    if(!advancedOpen && !r.group.startsWith('Wizard questions')){
      advancedOpen = true;
      html += `<details class="cfg-row" style="margin-top:10px;"${openSections.has('advRules')?' open':''} ontoggle="trackSectionToggle('advRules',this.open)"><summary><span class="cfg-name">Advanced planning rules</span><span class="cfg-sum">${WIZARD_RULES.length-i} rules</span></summary><div class="cfg-body">`;
    }
    if(r.group!==lastGroup){ html += `<div class="rule-group">${r.group}</div>`; lastGroup = r.group; }
    const tipId = `tip_${scope}_${r.key}`;
    let ctl;
    if(r.options){
      ctl = `<select onchange="${setter}('${r.key}',Number(this.value))">${r.options.map(o=>`<option value="${o}" ${Number(cur[r.key])===o?'selected':''}>${o} day${o===1?'':'s'}</option>`).join('')}</select>`;
    } else {
      ctl = `<label class="switch"><input type="checkbox" ${cur[r.key]?'checked':''} onchange="${setter}('${r.key}',this.checked)"><span class="slider"></span></label>`;
    }
    html += `<div class="wrule"><div class="wrule-top"><span class="wrule-name">${r.label}</span>
      <button type="button" class="tipbtn" title="${r.tip.replace(/"/g,'&quot;')}" onclick="document.getElementById('${tipId}').classList.toggle('show')" aria-label="What does this do?">ⓘ</button>${ctl}</div>
      <div class="wrule-tip" id="${tipId}">${r.tip}</div></div>`;
  });
  if(advancedOpen) html += '</div></details>';
  return html;
}
function setWizardRule(key,val){ state.wizardRules = Object.assign({}, state.wizardRules||{}, {[key]:val}); saveState(); }
function setWizRule(key,val){ wizard.rules = Object.assign({}, wizard.rules||{}, {[key]:val}); }
function resetWizardRules(){ state.wizardRules = {}; saveState(); render(); toast('Wizard settings reset to defaults'); }
function renderWizardRulesSection(){
  return `
    <details class="cat-card"${openSections.has('wizardRules')?' open':''} ontoggle="trackSectionToggle('wizardRules',this.open)">
      <summary><h3 class="section-title">Planning</h3><span class="sec-count"></span></summary>
      <div class="cat-body">
        <p class="section-desc">The rules the planning wizard follows for every plan. The wizard itself only asks simple questions (how busy, days out, fancying, freezer, new) — tap ⓘ for what each rule does.</p>
        ${renderRuleRows('set')}
        <button class="btn ghost small" onclick="resetWizardRules()">Reset to defaults</button>
      </div>
    </details>`;
}
if(!state.recipeGroupBy) state.recipeGroupBy = 'base';
if(!state.freezerBank) state.freezerBank = [];

/* ============================================================
   FIREBASE (live share + cloud backup)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBWyu_dYoZ2x0NXw1JJ-DcEAD6fEHmxCzk",
  authDomain: "meal-plan-2c5b0.firebaseapp.com",
  projectId: "meal-plan-2c5b0",
  storageBucket: "meal-plan-2c5b0.firebasestorage.app",
  messagingSenderId: "1094866173833",
  appId: "1:1094866173833:web:ac5618975734acd685ab58"
};
try{
  firebase.initializeApp(firebaseConfig);
  firebaseDb = firebase.firestore();
}catch(e){ console.error('Firebase init failed', e); }
try{
  firebaseAuth = firebase.auth();
}catch(e){ console.error('Firebase auth init failed', e); }

/* ---- cloud backup: sign in with Google, and mirror state to Firestore under
   the signed-in user's own uid so it survives this device losing its local
   storage entirely, and can be picked up again on any other device. ---- */
const cloudSessionId = uid()+uid(); // lets us tell "a change I just pushed up" apart from "a change that came from elsewhere"
let cloudUnsub = null;
function cloudDocRef(uidVal){ return firebaseDb.collection('users').doc(uidVal); }
function signInWithGoogle(){
  if(!firebaseAuth){ appAlert('Sign-in unavailable', "Sign-in isn't available right now — check your connection and try again."); return; }
  const provider = new firebase.auth.GoogleAuthProvider();
  firebaseAuth.signInWithRedirect(provider).catch(e=>{
    console.error('Google sign-in failed', e);
    appAlert("Couldn't start Google sign-in", ((e&&e.message)||'unknown error')+" — this usually means Google sign-in isn't enabled yet in the Firebase console (Authentication → Sign-in method), or this site isn't listed under Authentication → Settings → Authorized domains.");
  });
}
function signOutOfGoogle(){
  if(!firebaseAuth) return;
  appConfirm({title:'Sign out?', msg:'Your data stays backed up in the cloud, and this device keeps its own copy too.', ok:'Sign out'}, ()=>{
    if(cloudUnsub){ cloudUnsub(); cloudUnsub = null; }
    firebaseAuth.signOut();
  });
}
function pushStateToCloud(uidVal){
  if(!firebaseDb) return;
  cloudDocRef(uidVal).set({ state, updatedAt: Date.now(), updatedBy: cloudSessionId }).catch(e=>console.error('Cloud backup failed', e));
}
function applyRemoteState(remoteState){
  applyingRemoteState = true;
  state = remoteState;
  if(!state.freezerBank) state.freezerBank = [];
  runDataMigrations();
  if(!state.recipeGroupBy) state.recipeGroupBy = 'base';
  recomputeAllLastUsed();
  saveState(); // local cache only — guarded from bouncing straight back to the cloud
  render();
  applyingRemoteState = false;
}
function startCloudListener(uidVal){
  if(cloudUnsub || !firebaseDb) return;
  cloudUnsub = cloudDocRef(uidVal).onSnapshot(doc=>{
    if(!doc.exists) return;
    const data = doc.data();
    if(!data || !data.state || data.updatedBy===cloudSessionId) return; // our own echo — ignore
    applyRemoteState(data.state);
  }, e=>console.error('Cloud sync error', e));
}
function attachCloudSync(uidVal){
  if(!firebaseDb) return;
  cloudDocRef(uidVal).get().then(doc=>{
    const cloudState = (doc.exists && doc.data()) ? doc.data().state : null;
    const localHasContent = Object.keys(state.days||{}).length>0 || (state.recipes||[]).length>0;
    const cloudHasContent = !!cloudState && (Object.keys(cloudState.days||{}).length>0 || (cloudState.recipes||[]).length>0);
    if(localHasContent && cloudHasContent){
      window.__pendingCloudUid = uidVal;
      window.__pendingCloudState = cloudState;
      showOverlay(`
        <h2>Which data do you want to keep?</h2>
        <p class="desc">This device has its own meal plan data, and your Google account already has a cloud backup too. Pick one — the other gets replaced.</p>
        <div class="btnrow">
          <button class="btn ghost" onclick="resolveCloudConflict('cloud')">Use my cloud backup</button>
          <button class="btn primary" onclick="resolveCloudConflict('local')" style="flex:1;">Keep this device's data</button>
        </div>
      `);
    } else if(cloudHasContent){
      applyRemoteState(cloudState);
      startCloudListener(uidVal);
    } else {
      pushStateToCloud(uidVal);
      startCloudListener(uidVal);
    }
  }).catch(e=>console.error('Cloud fetch failed', e));
}
function resolveCloudConflict(choice){
  const uidVal = window.__pendingCloudUid;
  const cloudState = window.__pendingCloudState;
  if(choice==='cloud' && cloudState){ applyRemoteState(cloudState); }
  else { pushStateToCloud(uidVal); }
  startCloudListener(uidVal);
  closeOverlay();
  window.__pendingCloudUid = null;
  window.__pendingCloudState = null;
}
if(firebaseAuth){
  firebaseAuth.getRedirectResult().catch(e=>{
    console.error('Google sign-in failed', e);
    appAlert("Google sign-in didn't complete", (e&&e.message)||'unknown error');
  });
  firebaseAuth.onAuthStateChanged(user=>{
    currentUser = user;
    if(user){ attachCloudSync(user.uid); }
    else if(cloudUnsub){ cloudUnsub(); cloudUnsub = null; }
    render();
  });
}

const SHARE_META_KEY = 'mealPlanShareMeta';
function loadShareMeta(){
  try{ const raw = localStorage.getItem(SHARE_META_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return { active:false, weekStart:null, shareId:null };
}

/* ============================================================
   DATE HELPERS
   ============================================================ */
function toISO(d){ return d.toISOString().slice(0,10); }
function fromISO(iso){ return new Date(iso+'T12:00:00'); }
function addDays(iso,n){ const d=fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function todayISO(){ return toISO(new Date()); }
function weekDates(startISO){ return [0,1,2,3,4,5,6].map(i=>addDays(startISO,i)); }
function datesBetween(startISO, endISO){
  const dates = [];
  let cur = startISO, guard = 0;
  while(fromISO(cur) <= fromISO(endISO) && guard < 60){ dates.push(cur); cur = addDays(cur,1); guard++; }
  return dates.length ? dates : [startISO];
}
function weeksBetween(iso1, iso2){ return Math.round((fromISO(iso2)-fromISO(iso1))/(7*86400000)); }
function dayName(iso){ return fromISO(iso).toLocaleDateString(undefined,{weekday:'long'}); }
function dayShort(iso){ return fromISO(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function mondayOnOrBefore(iso){
  const d = fromISO(iso);
  const dow = d.getDay();
  const back = (dow===0)?6:dow-1;
  return addDays(iso, -back);
}
function getSeason(iso){
  const m = fromISO(iso).getMonth()+1; // 1-12, meteorological (Northern Hemisphere) seasons
  if(m===12||m===1||m===2) return 'winter';
  if(m>=3&&m<=5) return 'spring';
  if(m>=6&&m<=8) return 'summer';
  return 'autumn';
}
const SEASONS = ['winter','spring','summer','autumn'];

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer, toastActions = [];
function hideToast(){ const el = document.getElementById('toast'); if(el){ el.classList.remove('show','with-action'); } clearTimeout(toastTimer); }
function toast(msg, opts){
  const el = document.getElementById('toast');
  opts = opts || {};
  clearTimeout(toastTimer);
  toastActions = opts.actions || ((opts.actionLabel && opts.onAction) ? [{label:opts.actionLabel, onClick:opts.onAction}] : []);
  if(toastActions.length){
    el.innerHTML = `<span class="toast-msg">${escapeHtml(msg)}</span>` + toastActions.map((a,i)=>`<button type="button" class="toast-undo" data-i="${i}">${escapeHtml(a.label)}</button>`).join('');
    el.classList.add('show','with-action');
    (el.querySelectorAll ? el.querySelectorAll('.toast-undo') : []).forEach(btn=>{
      btn.onclick = (e)=>{
        if(e && e.stopPropagation) e.stopPropagation();
        const a = toastActions[Number(btn.getAttribute('data-i'))];
        hideToast();
        if(a) a.onClick();
      };
    });
    toastTimer = setTimeout(hideToast, opts.duration || 6000);
  } else {
    el.textContent = msg;
    el.classList.remove('with-action');
    el.classList.add('show');
    toastTimer = setTimeout(hideToast, 2200);
  }
}

/* ============================================================
   QUICK UNDO — a single-step safety net for swaps, moves, clears
   and deletes. Each of those calls captureUndo() right before it
   mutates state, then shows a toast with an Undo action; tapping
   it restores the whole app state exactly as it was.
   ============================================================ */
let undoSnapshot = null;
function captureUndo(){ undoSnapshot = JSON.stringify(state); }
function undoLastAction(){
  if(!undoSnapshot) return;
  try{ state = JSON.parse(undoSnapshot); }catch(e){ return; }
  undoSnapshot = null;
  saveState();
  refreshLiveShare();
  render();
  toast('Undone');
}
function toastWithUndo(msg, duration){
  toast(msg, {actionLabel:'Undo', onAction:undoLastAction, duration});
}

/* ============================================================
   DATA ACCESS
   ============================================================ */
function emptySlot(){ return {status:'empty', recipeId:null, recipeName:null, baseLabel:null}; }
function peekDay(dateISO){ return state.days[dateISO] || {lunch:emptySlot(), dinner:emptySlot()}; }
function ensureDay(dateISO){
  if(!state.days[dateISO]) state.days[dateISO] = {lunch:emptySlot(), dinner:emptySlot()};
  return state.days[dateISO];
}
function getRecipe(id){ return state.recipes.find(r=>r.id===id); }
function getMealBase(id){ return state.mealBases.find(b=>b.id===id); }
function getMealType(id){ return state.mealTypes.find(t=>t.id===id); }
function baseNames(r){ return (r.baseIds||[]).map(id=>{const b=getMealBase(id); return b?b.name:null;}).filter(Boolean); }
function typeNames(r){ return (r.typeIds||[]).map(id=>{const t=getMealType(id); return t?t.name:null;}).filter(Boolean); }
// the small label under a planned meal's name: its meal base(s), plus any meal types
// ticked "show under the meal" in Settings, e.g. "Pasta · Mindless"
function mealDisplayLabel(r){
  const bases = baseNames(r).join(' / ');
  const types = (r.typeIds||[]).map(id=>{ const t=getMealType(id); return t && t.showOnMeal ? t.name : null; }).filter(Boolean);
  return [bases, ...types].filter(Boolean).join(' · ');
}
function isBuiltInType(t){ const n = t && String(t.name||'').trim().toLowerCase(); return n==='new' || n==='freezer'; }
function typeBusyTier(t){ return t ? (t.busyTier!=null ? t.busyTier : (t.busyDay?2:0)) : 0; }
function recipeBusyTier(r){ return Math.max(0, ...(r.typeIds||[]).map(id=>typeBusyTier(getMealType(id)))); }
// lunch-only / dinner-only meal types: a recipe with any of those can only go in a matching slot
function recipeSlotOk(r, meal){
  const prefs = new Set((r.typeIds||[]).map(id=>{ const t=getMealType(id); return t && t.slotPref; }).filter(Boolean));
  return !prefs.size || prefs.has(meal);
}
function getOrCreateMealBase(name){
  let b = state.mealBases.find(b=>b.name.toLowerCase()===name.toLowerCase());
  if(!b){ b = {id:uid(), name, weeklyTarget:0, ruleType:'upto', excludedSeasons:[]}; state.mealBases.push(b); }
  return b;
}
function getOrCreateMealType(name){
  let t = state.mealTypes.find(t=>t.name.toLowerCase()===name.toLowerCase());
  if(!t){ t = {id:uid(), name, weeklyMin:0, slotPref:null, busyDay:false, manualOnly:false}; state.mealTypes.push(t); }
  return t;
}
function removeIfEphemeral(r){
  if(r.ephemeral){ state.recipes = state.recipes.filter(x=>x.id!==r.id); }
}
function addFreezerBankItem(name){

  saveState();
  return item;
}
// a meal that was pulled out of the freezer bank goes back into it if it's cleared,
// replaced or discarded — callers pass the slot objects that are about to be lost
function freezerNamesIn(slots){
  return slots.filter(s=>s && s.status==='planned' && s.fromFreezer && s.recipeName).map(s=>s.recipeName);
}
function returnToFreezer(names, on){

  names.forEach(n=>state.freezerBank.push({id:uid(), name:n}));
}
function freezerReturnNote(names, on){

  return `${names.length} freezer meal${names.length===1?'':'s'} back in the freezer: ${names.join(', ')}`;

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parseList(text){ return (text||'').split(/[,\n]/).map(s=>s.trim()).filter(Boolean); }

const NAME_STOPWORDS = new Set(['with','and','the','style','recipe','dish','from','into','over','your','this','that']);

function renderMealRow(date, meal, slot){
  let inner;
  if(slot.status==='out'){
    inner = `<div class="slot out">Out — no meal needed</div>`;
  } else if(slot.status==='planned' && (slot.recipeName || (slot.recipeId && getRecipe(slot.recipeId)))){
    const recipe = slot.recipeId ? getRecipe(slot.recipeId) : null;
    const name = slot.recipeName || (recipe ? recipe.name : '');
    const baseTxt = recipe ? mealDisplayLabel(recipe) : (slot.baseLabel || '');
    inner = `<div class="slot planned"><span class="rname">${escapeHtml(name)}</span><span class="rcat">${escapeHtml(baseTxt||'')}</span></div>`;
  } else {
    inner = `<div class="slot empty">+ add meal</div>`;
  }
  return `<div class="meal-row" data-date="${date}" data-meal="${meal}">
    <span class="meal-label">${meal}</span>${inner}
  </div>`;
}

let showPastDays = false;
function smartPlanButton(days, today, weekLabel){
  const open = days.filter(d=>d>=today);
  const slots = open.length*2;
  const empty = open.reduce((n,d)=>{ const x=peekDay(d); return n+(x.lunch.status==='empty'?1:0)+(x.dinner.status==='empty'?1:0); },0);
  const which = weekLabel==='This week' ? 'this week' : weekLabel==='Next week' ? 'next week' : `w/c ${dayShort(days[0])}`;
  if(!open.length) return {label:'Plan meals', sub:'pick the days and it plans them', action:'openWizard()'};
  if(empty===slots) return {label: open.length<7 ? `Plan the rest of ${which}` : `Plan ${which}`, sub:'a few quick questions, then it plans the week', action:'openWizard()'};
  if(empty>0) return {label:'Fill the gaps', sub:`${empty} meal${empty===1?'':'s'} still to plan ${which}`, action:'openWizard({fill:true})'};
  const nextLabel = weekLabel==='This week' ? 'Plan next week' : 'Plan the week after';
  return {label: nextLabel, sub:`${which.charAt(0).toUpperCase()+which.slice(1)} is all planned`, action:'openWizard({nextWeek:true})'};
}
function renderPlanAheadCard(){

  const any = weekDates(nextMonday).some(d=>{ const x=peekDay(d); return x.lunch.status!=='empty' || x.dinner.status!=='empty'; });

}

function attachHomeHandlers(){
  const wrap = document.getElementById('weekWrap');
  if(wrap){
    let sx=0, sy=0, dragging=false;
    wrap.addEventListener('touchstart', e=>{
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; dragging=true;
    }, {passive:true});
    wrap.addEventListener('touchend', e=>{
      if(!dragging) return; dragging=false;
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
        shiftWeek(dx < 0 ? 7 : -7);
      }
    }, {passive:true});
  }

  document.querySelectorAll('.meal-row').forEach(row=>{
    let rsx=0, rsy=0, rdragging=false;
    row.addEventListener('touchstart', e=>{
      rsx = e.touches[0].clientX; rsy = e.touches[0].clientY; rdragging=true;
    }, {passive:true});
    row.addEventListener('touchend', e=>{
      if(!rdragging) return; rdragging=false;
      const dx = e.changedTouches[0].clientX - rsx;
      const dy = e.changedTouches[0].clientY - rsy;
      if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
        const date = row.getAttribute('data-date');
        const meal = row.getAttribute('data-meal');
        const slot = peekDay(date)[meal];
        if(dx > 0){
          if(slot.status==='planned' && slot.recipeId){
            e.stopPropagation();
            swapMeal(date, meal);
          }
        } else {
          if(slot.status==='planned'){
            e.stopPropagation();
            openMovePrompt(date, meal);
          }
        }
      }
    }, {passive:true});

    row.addEventListener('click', ()=>{
      openSlotEditor(row.getAttribute('data-date'), row.getAttribute('data-meal'));
    });
  });

  const rangeLabel = document.getElementById('weekRangeLabel');
  if(rangeLabel) attachLongPress(rangeLabel, openClearWeekConfirm);
}

function attachLongPress(el, callback, duration){
  duration = duration || 550;
  let timer = null, moved = false;
  const start = ()=>{ moved = false; clearTimeout(timer); timer = setTimeout(()=>{ if(!moved) callback(); }, duration); };
  const cancel = ()=>{ clearTimeout(timer); };
  const move = ()=>{ moved = true; clearTimeout(timer); };
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchmove', move, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
}

function clearCurrentWeek(){
  captureUndo();
  const lost = [];
  weekDates(viewWeekStart).forEach(date=>{ const d = state.days[date]; if(d) lost.push(d.lunch, d.dinner); });
  const freezerNames = freezerNamesIn(lost);
  returnToFreezer(freezerNames);
  weekDates(viewWeekStart).forEach(date=>{ state.days[date] = {lunch:emptySlot(), dinner:emptySlot()}; });
  recomputeAllLastUsed();
  saveState();
  refreshLiveShare();
  closeOverlay();
  render();
  toastWithUndo(freezerNames.length ? `Week cleared — ${freezerReturnNote(freezerNames)}` : 'Week cleared', freezerNames.length ? 7000 : undefined);
}


/* ============================================================
   NOTICES: settings changed since a week was planned; "New" meal check-ins
   ============================================================ */
function settingsSignature(){
  const R = getRules();
  const src = JSON.stringify([
    WIZARD_RULES.map(x=>R[x.key]),
    state.mealBases.map(b=>[b.id,b.ruleType||'upto',b.weeklyTarget||0,(b.excludedSeasons||[]).slice().sort()]),
    state.mealTypes.map(t=>[t.id,t.weeklyMin||0,t.slotPref||'',typeBusyTier(t),!!t.manualOnly])
  ]);
  let h = 0; for(let i=0;i<src.length;i++){ h = ((h<<5)-h + src.charCodeAt(i))|0; }
  return String(h);
}
function staleDatesIn(days){
  const today = todayISO(), sig = settingsSignature();
  return days.filter(d=>d>=today && state.days[d] && state.days[d].planSig && state.days[d].planSig!==sig);
}
function renderStaleNotice(days){
  if(!staleDatesIn(days).length) return '';
  return `<div class="notice-card">
    <h3>Settings changed since this week was planned</h3>
    <p>Your rules, meal bases or meal types have changed. Re-plan the rest of the week to use the new settings, or keep it as it is.</p>
    <div class="btnrow" style="margin:0;"><button class="btn ghost small" onclick="dismissStale()">Keep as is</button><button class="btn primary small" onclick="replanStale()">Re-plan</button></div>
  </div>`;
}
function dismissStale(){
  const sig = settingsSignature();
  weekDates(viewWeekStart).forEach(d=>{ if(state.days[d] && state.days[d].planSig) state.days[d].planSig = sig; });
  saveState(); render();
}
function replanStale(){
  openWizard();
  const today = todayISO();
  wizard.startDate = viewWeekStart > today ? viewWeekStart : today;
  wizard.endDate = addDays(viewWeekStart, 6);
  renderWizardStep1();
}

let newReviewKeepOpen = null;
function newReviewSnoozedUntil(id){ return (state.newReviewSnooze||{})[id] || ''; }
function newTypeId(){ const t = state.mealTypes.find(t=>t.name.trim().toLowerCase()==='new'); return t ? t.id : null; }
function pendingNewReviews(){
  const nid = newTypeId(); if(!nid) return [];
  const today = todayISO(), eatenOn = {};
  Object.keys(state.days).forEach(d=>{
    if(d>=today) return;
    ['lunch','dinner'].forEach(m=>{ const s = state.days[d][m]; if(s && s.status==='planned' && s.recipeId && (!eatenOn[s.recipeId] || d>eatenOn[s.recipeId])) eatenOn[s.recipeId] = d; });
  });
  return state.recipes.filter(r=>!r.ephemeral && (r.typeIds||[]).includes(nid) && eatenOn[r.id] && !(newReviewSnoozedUntil(r.id) > today))
    .map(r=>({r, date:eatenOn[r.id]}));
}
function renderNewReviewCard(){
  const q = pendingNewReviews(); if(!q.length) return '';
  const {r, date} = q[0];
  if(newReviewKeepOpen===r.id){
    const f = window.__nrFreq, opts = [[1,'Any week'],[2,'Every 2 weeks'],[4,'Every 4 weeks'],[8,'Every 8 weeks']];
    return `<div class="notice-card">
      <h3>How often for ${escapeHtml(r.name)}?</h3>
      <p>How often should it come round?</p>
      <div class="chip-group" style="margin-bottom:10px;">${opts.map(([n,l])=>`<button type="button" class="chip ${f===n?'active':''}" onclick="setNrFreq(${n})">${l}</button>`).join('')}</div>
      <label class="busy-toggle" style="margin-bottom:10px;"><input type="checkbox" ${window.__nrMulti?'checked':''} onchange="window.__nrMulti=this.checked"> 2–3× a week</label>
      <div class="btnrow" style="margin:0;"><button class="btn ghost small" onclick="newReviewKeepOpen=null;render()">Back</button><button class="btn primary small" onclick="saveNewReview('${r.id}')">Save</button></div>
    </div>`;
  }
  return `<div class="notice-card">
    <h3>How did ${escapeHtml(r.name)} go?</h3>
    <p>You had it ${dayName(date)} ${dayShort(date)}. Keep it in your recipes?</p>
    <div class="btnrow" style="margin:0;flex-wrap:wrap;">
      <button class="btn ghost small" onclick="snoozeNewReview('${r.id}')">Ask later</button>
      <button class="btn ghost small" onclick="dropNewRecipe('${r.id}')">Not for us</button>
      <button class="btn primary small" onclick="newReviewKeep('${r.id}')">Keep it</button>
    </div>
  </div>`;
}
function newReviewKeep(id){ const r = getRecipe(id); if(!r) return; newReviewKeepOpen = id; window.__nrFreq = (r.frequencyWeeks>1 ? r.frequencyWeeks : 2); window.__nrMulti = !!r.multiply; render(); }
function setNrFreq(n){ window.__nrFreq = n; render(); }
function snoozeNewReview(id){ state.newReviewSnooze = Object.assign({}, state.newReviewSnooze||{}, {[id]: addDays(todayISO(),1)}); saveState(); render(); toast('Okay — I\'ll ask again tomorrow'); }
function saveNewReview(id){
  const r = getRecipe(id); if(!r) return;
  captureUndo();
  const nid = newTypeId();
  r.typeIds = (r.typeIds||[]).filter(t=>t!==nid);
  r.frequencyWeeks = window.__nrFreq || 2;
  r.multiply = !!window.__nrMulti;
  newReviewKeepOpen = null;
  saveState(); render();
  toastWithUndo(`Kept ${r.name} — no longer "New"`);
}
function dropNewRecipe(id){
  const r = getRecipe(id); if(!r) return;
  captureUndo();
  state.recipes = state.recipes.filter(x=>x.id!==id);
  saveState(); render();
  toastWithUndo(`Removed ${r.name} from your recipes`);
}

/* ---- duplicate recipe names ---- */
function normRecipeName(n){ return String(n||'').trim().toLowerCase().replace(/\s+/g,' '); }
function duplicateGroups(){
  const m = {};
  state.recipes.filter(r=>!r.ephemeral).forEach(r=>{ const k = normRecipeName(r.name); (m[k]=m[k]||[]).push(r); });
  return Object.values(m).filter(g=>g.length>1);
}
function renderDuplicatesSection(){
  const groups = duplicateGroups(); if(!groups.length) return '';
  const rows = groups.map(g=>`
    <div class="rule-row" style="display:block;">
      <div style="font-weight:700;">${escapeHtml(g[0].name)} <span class="sec-count">×${g.length}</span></div>
      ${g.map(r=>`<div class="rmeta" style="font-size:12px;color:var(--ink-soft);">• ${escapeHtml(baseNames(r).join(', ')||'no base')}${typeNames(r).length?' · '+escapeHtml(typeNames(r).join(', ')):''} · ${freqLabel(r)}</div>`).join('')}
      <button class="btn primary small" style="margin-top:8px;" onclick="mergeRecipes('${g.map(r=>r.id).join(',')}')">Merge into one</button>
    </div>`).join('');
  return `
    <details class="cat-card" open>
      <summary><h3 class="section-title">${icon('alert')}Possible duplicates</h3><span class="sec-count">${groups.length}</span></summary>
      <div class="cat-body">
        <p class="section-desc">These recipes share a name. Merging keeps one recipe with all their bases and types combined; planned meals point to the kept one.</p>
        ${rows}
      </div>
    </details>`;
}
function mergeRecipes(idsCsv){
  const ids = idsCsv.split(','); const group = ids.map(getRecipe).filter(Boolean);
  if(group.length<2) return;
  captureUndo();
  const uses = {}; Object.values(state.days).forEach(d=>['lunch','dinner'].forEach(m=>{ const s=d[m]; if(s && s.recipeId) uses[s.recipeId]=(uses[s.recipeId]||0)+1; }));
  group.sort((a,b)=>(uses[b.id]||0)-(uses[a.id]||0));
  const keep = group[0], drop = group.slice(1);
  drop.forEach(r=>{
    keep.baseIds = Array.from(new Set([...(keep.baseIds||[]), ...(r.baseIds||[])]));
    keep.typeIds = Array.from(new Set([...(keep.typeIds||[]), ...(r.typeIds||[])]));
    keep.multiply = keep.multiply || r.multiply;
  });
  const dropIds = new Set(drop.map(r=>r.id));
  Object.values(state.days).forEach(d=>['lunch','dinner'].forEach(m=>{ const s=d[m]; if(s && dropIds.has(s.recipeId)){ s.recipeId = keep.id; s.recipeName = keep.name; } }));
  state.recipes = state.recipes.filter(r=>!dropIds.has(r.id));
  recomputeAllLastUsed();
  saveState(); render();
  toastWithUndo(`Merged into one "${keep.name}"`);
}
function confirmIfDuplicateName(name, exceptId, cont){
  const k = normRecipeName(name);
  const clash = state.recipes.find(r=>!r.ephemeral && r.id!==exceptId && normRecipeName(r.name)===k);
  if(!clash){ cont(); return; }
  appConfirm({title:'Already in your recipes', msg:`You already have a recipe called "${clash.name}". Add another one anyway?`, ok:'Add anyway'}, cont);
}

/* ============================================================
   SLOT EDITOR (tap a meal on Home)
   ============================================================ */
function openSlotEditor(date, meal){
  currentSlotDate = date; currentSlotMeal = meal;

  const shown = new Set();
  const baseSections = state.mealBases.map(b=>{
    const recs = state.recipes.filter(r=>!r.ephemeral && (r.baseIds||[]).includes(b.id));

    recs.forEach(r=>shown.add(r.id));
    return `<details class="picker-cat"><summary><span class="bname">${escapeHtml(b.name)}</span><span class="count">${recs.length} recipe${recs.length===1?'':'s'}</span></summary><div class="opts">${recs.map(r=>`
      <div class="picker-opt" onclick="assignSlot('${date}','${meal}','${r.id}')">

      </div>`).join('')}</div></details>`;

  const other = state.recipes.filter(r=>!r.ephemeral && !shown.has(r.id));

      <div class="picker-opt" onclick="assignSlot('${date}','${meal}','${r.id}')">
        <span>${escapeHtml(r.name)}</span>
        <span class="meta">${escapeHtml(typeNames(r).join(', ')) || freqLabel(r)}</span>

    + `<button type="button" class="chip" style="border-style:dashed;" onclick="qaNewBase()">+ new base</button>`;
  const typeChips = state.mealTypes.map(t=>`<button type="button" class="chip type-chip" data-id="${t.id}" onclick="toggleQaType('${t.id}')">${escapeHtml(t.name)}</button>`).join('')
    + `<button type="button" class="chip type-chip" style="border-style:dashed;" onclick="qaNewType()">+ new type</button>`;

  let topHtml;
  if(cur.status==='planned'){
    topHtml = `
    <div class="current-meal">
      <div class="cm-name">${escapeHtml(cur.recipeName || (curRecipe?curRecipe.name:''))}</div>
      <div class="cm-label">${escapeHtml(curRecipe ? mealDisplayLabel(curRecipe) : (cur.baseLabel||''))}</div>
    </div>
    <div class="action-grid">
      ${cur.recipeId ? `<button class="btn primary" onclick="closeOverlay();swapMeal('${date}','${meal}')">Suggest another</button>` : ''}
      <button class="btn ghost" onclick="closeOverlay();openMovePrompt('${date}','${meal}')">Move / swap day</button>
      ${curRecipe ? `<button class="btn ghost" onclick="openRecipeEditor('${curRecipe.id}')">Edit recipe</button>` : ''}
      <button class="btn ghost" onclick="assignSlot('${date}','${meal}',null,'out')">Mark as out</button>
      <button class="btn ghost" onclick="assignSlot('${date}','${meal}',null,'empty')">Clear</button>
    </div>
    <p class="hint" style="margin:-8px 0 14px;">Shortcuts: swipe right to suggest another, left to move.</p>
    <h4 style="margin:0 0 8px;">Or pick something else</h4>`;
  } else if(cur.status==='out'){
    topHtml = `<div class="current-meal"><div class="cm-name">Out — no meal needed</div></div>
    <div class="action-grid"><button class="btn ghost" onclick="assignSlot('${date}','${meal}',null,'empty')">Not out after all</button></div>`;
  } else {
    topHtml = `<div class="action-grid">
      <button class="btn primary" onclick="closeOverlay();swapMeal('${date}','${meal}')">Suggest one</button>
      <button class="btn ghost" onclick="assignSlot('${date}','${meal}',null,'out')">Mark as out</button>
    </div>
    <h4 style="margin:0 0 8px;">Or pick one</h4>`;
  }
  showOverlay(`
    <h2>${dayName(date)} · ${meal}</h2>
    <p class="desc">${dayShort(date)}</p>
    ${topHtml}
    <div class="field" style="margin-bottom:16px;">
      <label>Just write it in — quick, one-off, no need to save it as a recipe</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="freeTextInput" placeholder="e.g. Leftovers, Mum's, takeaway" style="flex:1;padding:10px 12px;border-radius:8px;border:1.5px solid var(--paper-line);font-size:14px;">
        <button class="btn primary small" onclick="assignFreeText('${date}','${meal}')">Use</button>
      </div>
    </div>
    <input type="text" id="slotSearch" placeholder="Search recipes…" oninput="filterSlotRecipes()" style="width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--paper-line);font-size:14px;margin-bottom:14px;">
    <div id="slotRecipeList">
      ${baseSections}${otherSection}${noneMsg}

      <div class="chip-group" style="margin-bottom:8px;" id="qaBaseChips">${baseChips}</div>
      <div class="chip-group" id="qaTypeChips">${typeChips}</div>
      <button class="btn primary small" style="width:100%;margin-top:10px;" onclick="quickAdd('${date}','${meal}')">Add &amp; use for this meal</button>
    </div>

}
function filterSlotRecipes(){
  const input = document.getElementById('slotSearch');
  const q = (input ? input.value : '').trim().toLowerCase();
  let totalVisible = 0;
  document.querySelectorAll('#slotRecipeList .picker-cat').forEach(details=>{
    let anyVisible = false;
    details.querySelectorAll('.picker-opt').forEach(opt=>{
      const match = !q || opt.textContent.toLowerCase().includes(q);
      opt.style.display = match ? '' : 'none';
      if(match){ anyVisible = true; totalVisible++; }
    });
    details.style.display = anyVisible ? '' : 'none';
    if(q) details.open = anyVisible; else details.removeAttribute('open');
  });
  const noMatch = document.getElementById('slotNoMatch');
  if(noMatch){
    noMatch.style.display = (q && totalVisible===0) ? '' : 'none';
    const termEl = document.getElementById('slotNoMatchTerm');
    if(termEl) termEl.textContent = input ? input.value.trim() : '';
  }
}
function toggleQaBase(id){
  const d = window.__qaDraft; const i = d.baseIds.indexOf(id);
  if(i===-1) d.baseIds.push(id); else d.baseIds.splice(i,1);
  const el = document.querySelector(`#qaBaseChips [data-id="${id}"]`); if(el) el.classList.toggle('active');
}
function toggleQaType(id){
  const d = window.__qaDraft; const i = d.typeIds.indexOf(id);
  if(i===-1) d.typeIds.push(id); else d.typeIds.splice(i,1);
  const el = document.querySelector(`#qaTypeChips [data-id="${id}"]`); if(el) el.classList.toggle('active');
}
function qaNewBase(){
  appPrompt({title:'New meal base', placeholder:'e.g. Couscous'}, name=>{
    if(!name || !name.trim()) return;
    const typedName = (document.getElementById('qaName')||{}).value || '';
    const b = getOrCreateMealBase(name.trim());
    const keep = window.__qaDraft;
    openSlotEditor(currentSlotDate, currentSlotMeal);
    window.__qaDraft.baseIds = [...keep.baseIds, b.id];
    const el = document.querySelector(`#qaBaseChips [data-id="${b.id}"]`); if(el) el.classList.add('active');
    const nameEl = document.getElementById('qaName'); if(nameEl) nameEl.value = typedName;
  });
}
function qaNewType(){
  appPrompt({title:'New meal type', placeholder:'e.g. Batch cook'}, name=>{
    if(!name || !name.trim()) return;
    const typedName = (document.getElementById('qaName')||{}).value || '';
    const t = getOrCreateMealType(name.trim());
    const keep = window.__qaDraft;
    openSlotEditor(currentSlotDate, currentSlotMeal);
    window.__qaDraft.typeIds = [...keep.typeIds, t.id];
    const el = document.querySelector(`#qaTypeChips [data-id="${t.id}"]`); if(el) el.classList.add('active');
    const nameEl = document.getElementById('qaName'); if(nameEl) nameEl.value = typedName;
  });
}
function quickAdd(date, meal){
  const nameEl = document.getElementById('qaName');
  const name = nameEl.value.trim();
  if(!name){ nameEl.focus(); return; }
  confirmIfDuplicateName(name, null, ()=>{
    const d = window.__qaDraft;
    const recipe = {id:uid(), name, baseIds:[...d.baseIds], typeIds:[...d.typeIds], frequencyWeeks:1, multiply:false, lastUsedWeekStart:null, ephemeral:false};
    state.recipes.push(recipe);
    assignSlot(date, meal, recipe.id);
  });
}
function assignSlot(date, meal, recipeId, forceStatus){
  captureUndo();
  const day = ensureDay(date);
  const had = day[meal];
  const backToFreezer = freezerNamesIn([had]);
  returnToFreezer(backToFreezer);
  if(forceStatus==='out'){ day[meal] = {status:'out', recipeId:null, recipeName:null, baseLabel:null}; }
  else if(forceStatus==='empty'){ day[meal] = emptySlot(); }
  else {
    const r = getRecipe(recipeId);
    day[meal] = {status:'planned', recipeId, recipeName: r?r.name:null, baseLabel: r ? (mealDisplayLabel(r)||null) : null};
    if(r) removeIfEphemeral(r);
  }
  // whatever recipe left this slot (cleared, marked out, or swapped for something else)
  // must stop being treated as "used" here if it isn't actually on the calendar any more
  recomputeAllLastUsed();
  saveState();
  refreshLiveShare();
  closeOverlay();
  render();
  const fnote = backToFreezer.length ? ` — ${freezerReturnNote(backToFreezer)}` : '';
  if(forceStatus==='out') toastWithUndo('Marked as out'+fnote, fnote?7000:undefined);
  else if(forceStatus==='empty' && had.status!=='empty') toastWithUndo('Cleared'+fnote, fnote?7000:undefined);
  else if(fnote) toastWithUndo('Replaced'+fnote, 7000);
}
function assignFreeText(date, meal){
  const input = document.getElementById('freeTextInput');
  const text = input.value.trim();
  if(!text){ input.focus(); return; }
  captureUndo();
  const day = ensureDay(date);
  const backToFreezer = freezerNamesIn([day[meal]]);
  returnToFreezer(backToFreezer);
  day[meal] = {status:'planned', recipeId:null, recipeName:text, baseLabel:null};
  recomputeAllLastUsed(); // in case a real recipe was sitting in this slot before
  saveState();
  refreshLiveShare();
  closeOverlay();
  render();
  if(backToFreezer.length) toastWithUndo('Replaced — '+freezerReturnNote(backToFreezer), 7000);
}

/* ---- swap: swipe a planned meal right to swing in a different eligible recipe ---- */
function swapMeal(date, meal){
  const day = ensureDay(date);
  const cur = day[meal];
  const curRecipe = (cur.status==='planned' && cur.recipeId) ? getRecipe(cur.recipeId) : null;
  captureUndo();
  const before = undoSnapshot;
  returnToFreezer(freezerNamesIn([cur]));
  day[meal] = emptySlot();
  // run the real planner for just this one meal, with the rest of the week as context,
  // so a suggestion follows exactly the same rules as a full plan
  const saved = wizard;
  wizard = { startDate:date, endDate:date, skips:{}, fancyBaseIds:[], skipMinBaseIds:[], busyDate:null, busyLevel:1,
    freezerSelectedIds:[], newText:'', newItemsQueue:[], newItemsIndex:0, rules:{},
    onlySlots:[date+'_'+meal], excludeIds: curRecipe ? [curRecipe.id] : [], quiet:true, noUndo:true, contextCounts:true, scaleSlots:14 };
  let filled = 0;
  try{ filled = proceedGeneratePlan(false); } finally { wizard = saved; }
  undoSnapshot = before;
  const now = state.days[date][meal];
  if(!filled || now.status!=='planned'){
    try{ state = JSON.parse(before); }catch(e){}
    saveState(); render();
    toast(curRecipe ? 'Nothing else fits your rules for this meal' : 'No recipes fit your rules here — try picking one');
    return;
  }
  toastWithUndo(curRecipe ? `Swapped in ${now.recipeName}` : `Added ${now.recipeName}`);
}

/* ---- move: swipe a planned meal left to relocate it to a different day/meal ---- */
let moveSource = null;
function openMovePrompt(date, meal, showOther){
  const slot = peekDay(date)[meal];
  if(slot.status!=='planned') return;
  moveSource = {date, meal};
  const week = weekDates(mondayOnOrBefore(date));
  const cell = (d,m)=>{
    const x = peekDay(d)[m];
    const isCur = d===date && m===meal;
    const what = x.status==='planned' ? escapeHtml(x.recipeName||'') : x.status==='out' ? 'out' : 'free';
    return `<button type="button" class="move-cell ${isCur?'current':''}" ${isCur?'disabled':''} onclick="moveTo('${d}','${m}')">${m==='lunch'?'Lunch':'Dinner'}<small>${isCur?'(here now)':what}</small></button>`;
  };
  showOverlay(`
    <h2>Move "${escapeHtml(slot.recipeName||'this meal')}"</h2>
    <p class="desc">Tap where it should go. If there's already a meal there, you can swap the two.</p>
    <div class="move-grid">
      ${week.map(d=>`<span class="mday">${dayName(d).slice(0,3)} <span style="font-weight:400;color:var(--ink-soft);">${dayShort(d).replace(/^\w+\s/,'')}</span></span>${cell(d,'lunch')}${cell(d,'dinner')}`).join('')}
    </div>
    ${showOther ? `
    <div class="field"><label>Another date</label><input type="date" id="moveDate" value="${date}"></div>
    <div class="chip-group" style="margin-bottom:10px;">
      <button type="button" class="chip" onclick="moveTo(document.getElementById('moveDate').value,'lunch')">Lunch</button>
      <button type="button" class="chip" onclick="moveTo(document.getElementById('moveDate').value,'dinner')">Dinner</button>
    </div>` : `<button class="btn ghost small" onclick="openMovePrompt('${date}','${meal}',true)">Another date…</button>`}
    <div class="btnrow"><button class="btn ghost" style="flex:1;" onclick="closeOverlay()">Cancel</button></div>
  `);
}
function moveTo(targetDate, targetMeal){
  if(!targetDate || !targetMeal || !moveSource) return;
  if(targetDate===moveSource.date && targetMeal===moveSource.meal){ closeOverlay(); moveSource = null; return; }
  const destSlot = peekDay(targetDate)[targetMeal];
  if(destSlot.status==='planned'){
    showOverlay(`
      <h2>Swap or replace?</h2>
      <p class="desc">${dayName(targetDate)} ${targetMeal} already has "${escapeHtml(destSlot.recipeName||'a meal')}".</p>
      <div class="btnrow">
        <button class="btn ghost" onclick="openMovePrompt('${moveSource.date}','${moveSource.meal}')">Back</button>
        <button class="btn primary" style="flex:1;" onclick="doMove('${targetDate}','${targetMeal}',true)">Swap the two</button>
      </div>
      <button class="link-danger" onclick="doMove('${targetDate}','${targetMeal}',false)">Replace it instead (removes "${escapeHtml(destSlot.recipeName||'the other meal')}")</button>
    `);
  } else {
    doMove(targetDate, targetMeal, false);
  }
}
function doMove(targetDate, targetMeal, swap){
  captureUndo();
  const srcDay = ensureDay(moveSource.date);
  const dstDay = ensureDay(targetDate);
  const srcSlot = srcDay[moveSource.meal];
  const dstSlot = dstDay[targetMeal];
  const backToFreezer = swap ? [] : freezerNamesIn([dstSlot]); // "replace it" discards the old one
  returnToFreezer(backToFreezer);
  if(swap){
    dstDay[targetMeal] = srcSlot;
    srcDay[moveSource.meal] = dstSlot;
  } else {
    dstDay[targetMeal] = srcSlot;
    srcDay[moveSource.meal] = emptySlot();
  }
  moveSource = null;
  // a moved (or swapped) recipe's "last used" date must follow it to wherever it actually
  // ended up on the calendar now — recompute from the calendar itself rather than guessing
  recomputeAllLastUsed();
  saveState();
  refreshLiveShare();
  closeOverlay();
  render();
  toastWithUndo((swap ? 'Swapped' : 'Moved')+(backToFreezer.length ? ' — '+freezerReturnNote(backToFreezer) : ''), backToFreezer.length?7000:undefined);
}
